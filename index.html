<style>
:root{
  --bg:#FFFFFF; --bg-2:#F5F6F8; --bg-3:#EDEFF2;
  --line:#E4E7EB; --line-2:#CDD4DB;
  --ink:#141A21; --ink-2:#5B6773; --ink-3:#8B95A1;
  --grn:#1F6F4A; --grn-d:#175539; --grn-l:#EAF3EE;
  --warn:#8A6A12; --warn-l:#FFF8E6; --warn-b:#F0E3BE;
  --r:10px; --sh:0 1px 2px rgba(20,26,33,.05); --sh-2:0 6px 22px rgba(20,26,33,.09);
  --wrap:1140px; --hd:66px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 16.5px/1.68 'Manrope',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--grn);outline-offset:2px}
::selection{background:var(--grn);color:#fff}
h1,h2,h3{font-family:'Onest',sans-serif;letter-spacing:-.02em;margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px;width:100%}
.sec{padding:50px 0}
.sec.grey{background:var(--bg-2)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.dim{color:var(--ink-2)}
.hide{display:none !important}

header.top{position:sticky;top:0;z-index:60;height:var(--hd);background:rgba(255,255,255,.93);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{height:100%;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;flex-shrink:0;object-fit:contain;display:block}
.brand b{font-family:'Onest',sans-serif;font-weight:700;font-size:16px;white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{padding:9px 13px;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink-2);
  white-space:nowrap;transition:.15s}
.nav a:hover{background:var(--bg-2);color:var(--ink)}
.nav a.on{background:var(--grn-l);color:var(--grn-d);font-weight:600}
.burger{display:none;width:42px;height:42px;margin-left:auto;border:1px solid var(--line);
  background:#fff;border-radius:8px;cursor:pointer;place-items:center}
.drawer{position:fixed;inset:var(--hd) 0 0;background:#fff;z-index:55;display:none;padding:10px 0;overflow:auto}
.drawer.open{display:block}
.drawer a{display:block;padding:16px 22px;font-family:'Onest';font-size:17px;font-weight:600;
  border-bottom:1px solid var(--line)}

.hero{position:relative;padding:64px 0 52px;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::after{content:"";position:absolute;right:-60px;top:-50px;width:500px;height:500px;
  background-image:repeating-conic-gradient(var(--grn-l) 0% 25%,transparent 0% 50%);
  background-size:110px 110px;
  mask-image:radial-gradient(closest-side,#000,transparent);
  -webkit-mask-image:radial-gradient(closest-side,#000,transparent);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:clamp(36px,6.8vw,70px);font-weight:800;line-height:1.03;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--grn)}
.hero p{margin:18px 0 0;font-size:clamp(16px,2vw,19px);color:var(--ink-2);max-width:54ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(22px,3vw,30px);font-weight:700}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--grn);display:block;margin-bottom:7px}
.link{font-size:15px;font-weight:600;color:var(--grn)}
.link:hover{color:var(--grn-d);text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;
  border:1px solid var(--line-2);background:#fff;border-radius:9px;cursor:pointer;
  font-size:15px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--grn);color:var(--grn)}
.btn.primary{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.primary:hover{background:var(--grn-d);border-color:var(--grn-d);color:#fff}
.btn.danger{color:#B3392F;border-color:#E6C6C2}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:8px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:var(--sh);transition:.18s;display:block}
a.card:hover{box-shadow:var(--sh-2);transform:translateY(-2px);border-color:var(--line-2)}
.card h3{font-size:18px;font-weight:600;line-height:1.35;margin:10px 0 8px}
.card p{margin:0;font-size:15px;color:var(--ink-2)}
.card .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-3)}
.card .more{display:inline-block;margin-top:12px;font-size:14.5px;font-weight:600;color:var(--grn)}
.thumb{aspect-ratio:16/9;background:var(--bg-3);border-radius:8px;overflow:hidden;
  display:grid;place-items:center;margin-bottom:14px}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:#A9B2BC}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
  font-size:12.5px;font-weight:600;background:var(--grn-l);color:var(--grn-d)}
.badge.past{background:var(--bg-3);color:var(--ink-2)}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:24px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 17px;border:1px solid var(--line);background:#fff;border-radius:99px;
  cursor:pointer;font-size:15px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:.15s}
.tabs button:hover{border-color:var(--line-2)}
.tabs button.on{background:var(--grn);border-color:var(--grn);color:#fff}

.tbl-wrap{border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;background:#fff;
  box-shadow:var(--sh);margin-bottom:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
table.tbl th{text-align:left;padding:12px 14px;background:var(--bg-2);border-bottom:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--line)}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--bg-2)}
.n{font-family:'IBM Plex Mono',monospace;color:var(--ink-2)}
tr.top td:first-child{color:var(--grn);font-weight:600}
.tbl-cap{font-family:'Onest';font-weight:600;font-size:15px;margin:22px 0 8px}

.page-head{background:var(--bg-2);border-bottom:1px solid var(--line);padding:40px 0 34px}
.page-head h1{font-size:clamp(27px,4.4vw,42px);font-weight:800}
.page-head p{margin:12px 0 0;color:var(--ink-2);max-width:68ch;font-size:17px}
.crumbs{font-size:14px;color:var(--ink-3);margin-bottom:12px}
.crumbs a:hover{color:var(--grn)}
.article{max-width:760px}
.article p{margin:0 0 17px;font-size:17.5px;line-height:1.78}
.article p.lead{font-size:19px;font-weight:500;color:var(--ink)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.info div{background:#fff;padding:14px 16px}
.info span{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.info b{font-weight:600;font-size:15.5px}
.note{background:var(--bg-2);border-left:3px solid var(--grn);border-radius:0 8px 8px 0;
  padding:13px 16px;font-size:15px;color:var(--ink-2);margin:14px 0}
.warn{background:var(--warn-l);border:1px solid var(--warn-b);border-left:3px solid #D6A83A;
  border-radius:0 8px 8px 0;padding:13px 16px;font-size:15px;color:var(--warn);margin:16px 0}
.warn b{display:block;margin-bottom:4px;font-family:'Onest';font-size:14px}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:32px 22px;text-align:center;
  background:var(--bg-2)}
.empty b{display:block;font-family:'Onest';font-size:16px;margin-bottom:6px}
.empty span{font-size:15px;color:var(--ink-2)}
.photo{margin:20px 0}
.photo figcaption{font-size:14px;color:var(--ink-3);margin-top:8px}
iframe.map{width:100%;height:380px;border:1px solid var(--line);border-radius:var(--r)}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:var(--sh);margin-bottom:16px}
.panel>h3{font-size:16px;font-weight:700;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
label.lab{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.fld{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  font-size:15px;width:100%}
.fld:focus{border-color:var(--grn);outline:none}
textarea.fld{min-height:120px;resize:vertical;line-height:1.6}
.ed-list a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  margin-bottom:6px;font-size:14.5px}
.ed-list a.on{border-color:var(--grn);background:var(--grn-l);color:var(--grn-d)}
.ed{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;background:var(--ink);
  color:#fff;padding:12px 20px;border-radius:10px;font-size:15px;box-shadow:var(--sh-2)}

footer{background:var(--bg-2);border-top:1px solid var(--line);padding:40px 0 26px;margin-top:10px}
.f-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:26px}
footer h4{font-size:13.5px;color:var(--ink-3);margin:0 0 10px;font-weight:600}
footer a{display:block;padding:4px 0;font-size:15px;color:var(--ink-2)}
footer a:hover{color:var(--grn)}
.f-bot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-3)}

@media(max-width:1000px){ .nav{display:none} .burger{display:grid} }
@media(max-width:860px){ .g3{grid-template-columns:repeat(2,1fr)} .ed{grid-template-columns:1fr} }
@media(max-width:680px){
  body{font-size:17px}
  .sec{padding:36px 0}
  .g2,.g3{grid-template-columns:1fr}
  .f-grid{grid-template-columns:1fr}
  .hero::after{width:300px;height:300px;right:-110px;opacity:.7}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.tbl{min-width:560px;font-size:15px}
  table.tbl th,table.tbl td{padding:11px 12px;white-space:nowrap}
  table.tbl td:nth-child(2){white-space:normal;min-width:170px}
  iframe.map{height:300px}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=['січня','лютого','березня','квітня','травня','червня','липня','серпня',
  'вересня','жовтня','листопада','грудня'];
function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso); if(isNaN(d)) return esc(iso);
  return d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();
}
function fmtRange(a,b){
  if(!b||a===b) return fmtDate(a);
  const d1=new Date(a), d2=new Date(b);
  if(d1.getMonth()===d2.getMonth()&&d1.getFullYear()===d2.getFullYear())
    return d1.getDate()+'–'+d2.getDate()+' '+M[d2.getMonth()]+' '+d2.getFullYear();
  return fmtDate(a)+' — '+fmtDate(b);
}

function parseHash(){
  const raw=(location.hash||'#/').replace(/^#\/?/,'');
  const [path,qs]=raw.split('?');
  const seg=path.split('/').filter(Boolean); const q={};
  new URLSearchParams(qs||'').forEach((v,k)=>q[k]=v);
  return {seg,q,route:seg[0]||'home',id:seg[1]||null};
}
const VIEWS={home:vHome, news:vNews, search:vSearch, tournaments:vTournaments, about:vAbout, contacts:vContacts, editor:vEditor};

  const r=parseHash();
  $('#app').innerHTML=(VIEWS[r.route]||v404)(r);
  window.scrollTo(0,0);
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r.route));
  $('#drawer').classList.remove('open');
  bind(r);
}

/* ---------------- новини ---------------- */
function vNews(r){
  if(r.id) return vNewsItem(r.id);
  const ys=years(), year=r.q.year||ys[0]||'';
  const list=newsSorted().filter(n=>!year||n.year===year);
  let h=head('Новини','Матеріали шахового життя Одеси за роками.');
  h+='<section class="sec"><div class="wrap">';
  if(ys.length) h+='<div class="tabs">'+ys.map(y=>
    '<button data-go="#/news?year='+y+'" class="'+(year===y?'on':'')+'">'+y+'</button>').join('')+
    '<button data-go="#/news?year=all" class="'+(year==='all'?'on':'')+'">Усі роки</button></div>';
  const shown=year==='all'?newsSorted():list;
  h+= shown.length?'<div class="grid g3">'+shown.map(nCard).join('')+'</div>'
    : empty('За цей рік матеріалів немає','Оберіть інший рік.');
  return h+'</div></section>';
}
function tableBlock(t){
  let h='<div class="tbl-cap">'+esc(t.title)+'</div>';
  if(t.groups){
    h+=t.groups.map(g=>'<div style="margin-bottom:16px">'+
      '<div class="dim" style="font-size:14.5px;font-weight:600;margin-bottom:6px">'+esc(g.label)+'</div>'+
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+g.head.map(x=>'<th>'+esc(x)+'</th>').join('')+
      '</tr></thead><tbody>'+g.rows.map(row=>'<tr>'+row.map((c,i)=>
        '<td data-l="'+esc(g.head[i])+'"'+(i===0?' class="n"':'')+'>'+esc(c)+'</td>').join('')+
        '</tr>').join('')+'</tbody></table></div></div>').join('');
  } else if(t.rows){
    h+='<div class="tbl-wrap"><table class="tbl"><thead><tr>'+t.head.map(x=>'<th>'+esc(x)+'</th>').join('')+
      '</tr></thead><tbody>'+t.rows.map((row,i)=>'<tr class="'+(i<3?'top':'')+'">'+row.map((c,j)=>
      '<td data-l="'+esc(t.head[j])+'"'+(j===0||j>2?' class="n"':'')+'>'+esc(c)+'</td>').join('')+
      '</tr>').join('')+'</tbody></table></div>';
  }
  return h;
}
function vNewsItem(id){
  const n=getNews(id); if(!n) return v404();
  const ann=DATA.announcements.find(a=>a.newsId===n.id);
  let h='<section class="page-head"><div class="wrap">'+
    '<div class="crumbs"><a href="#/">Головна</a> / <a href="#/news">Новини</a> / '+
      '<a href="#/news?year='+esc(n.year)+'">'+esc(n.year)+'</a></div>'+
    '<p class="dim mono" style="margin:0 0 10px;font-size:14px">'+
      esc(n.date?fmtDate(n.date):(n.dateNote||''))+'</p>'+
    '<h1>'+esc(n.title)+'</h1>'+
    (n.status?'<div style="margin-top:12px"><span class="badge'+(n.status==='Перевірено'?'':' past')+'">'+esc(n.status)+'</span></div>':'')+
    '</div></section>'+
    '<section class="sec"><div class="wrap"><div class="article">'+
    (n.lead?'<p class="lead">'+esc(n.lead)+'</p>':'')+
    (n.body||[]).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>';
  (n.photos||[]).forEach(p=>{
    h+='<figure class="photo" style="max-width:760px">'+
      (p.src?'<img src="'+esc(p.src)+'" alt="" style="border-radius:10px">'
            :'<div class="thumb" style="aspect-ratio:16/7"><span>ФОТО НЕ ПЕРЕНЕСЕНО</span></div>')+
      (p.caption?'<figcaption>'+esc(p.caption)+'</figcaption>':'')+'</figure>';
  });
  (n.tables||[]).forEach(t=>h+=tableBlock(t));
  if((n.docs||[]).length) h+='<div class="tbl-cap">Документи</div>'+
    '<div class="grid g2">'+n.docs.map(x=>'<a class="card" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+
    '<h3 style="margin:0 0 6px">'+esc(x.title)+'</h3><span class="more">Відкрити документ →</span></a>').join('')+'</div>';
  const rel=(n.related||[]).map(getNews).filter(Boolean);
  if(rel.length) h+='<div class="sec-head" style="margin-top:36px"><div>'+
    '<span class="eyebrow">Пов’язані матеріали</span><h2>З тієї самої теми</h2></div></div>'+
    '<div class="grid g3">'+rel.map(nCard).join('')+'</div>';
  if(ann) h+='<div class="sec-head" style="margin-top:34px"><div>'+
    '<span class="eyebrow">Анонс</span><h2>Турнір в анонсах</h2></div></div>'+
    '<div class="grid g2">'+aCard(ann)+'</div>';
  return h+'</div></section>';
}

function vSearch(r){
  const q=(r.q.q||'').trim(), lq=q.toLowerCase();
  let h=head('Пошук','Новини, шахісти, турніри, прізвища та ключові слова.');
  h+='<section class="sec"><div class="wrap"><div class="filters">'+
    '<input type="search" id="sq" placeholder="Прізвище, назва турніру, рік або ключове слово" value="'+esc(q)+'" style="min-width:280px;flex:1">'+
    '<button class="btn primary" id="sgo">Знайти</button></div>';
  if(!q) return h+empty('Введіть запит','Пошук працює по новинах, турнірах, прізвищах, роках і текстах таблиць.')+'</div></section>';
  const hay=n=>[n.title,n.lead,n.year,(n.body||[]).join(' '),
    (n.tables||[]).map(t=>[(t.rows||[]).map(r=>r.join(' ')).join(' '),
      (t.groups||[]).map(g=>g.label+' '+g.rows.map(r=>r.join(' ')).join(' ')).join(' ')].join(' ')).join(' ')]
    .join(' ').toLowerCase();
  const nres=DATA.news.filter(n=>hay(n).includes(lq));
  const ares=DATA.announcements.filter(a=>(a.title+' '+(a.lead||'')).toLowerCase().includes(lq));
  const total=nres.length+ares.length;
  h+='<p class="dim">Знайдено: '+total+'</p>';
  if(!total) return h+empty('Нічого не знайдено','Спробуйте коротший запит.')+'</div></section>';
  if(ares.length) h+='<div class="tbl-cap">Анонси — '+ares.length+'</div><div class="grid g2">'+ares.map(aCard).join('')+'</div>';
  if(nres.length) h+='<div class="tbl-cap">Новини та матеріали — '+nres.length+'</div>'+
    '<div class="grid g3">'+nres.map(nCard).join('')+'</div>';
  return h+'</div></section>';
}

/* ---------------- редактор контенту ---------------- */
let OK=false, sel=null, kind='news';
function vEditor(){
  if(!OK) return head('Редактор контенту','')+'<section class="sec"><div class="wrap" style="max-width:400px">'+
    '<div class="panel"><h3>Вхід</h3><label class="lab">Код доступу</label>'+
    '<input class="fld" type="password" id="pw">'+
    '<div style="margin-top:14px"><button class="btn primary" id="go">Увійти</button></div>'+
    '<p class="dim" style="font-size:14px;margin:12px 0 0">Тимчасовий код — <b>odesa</b>. '+
    'Редактор працює в браузері: правки зберігаються у файл site-data.json, який замінює контент сайту.</p>'+
    '</div></div></section>';
  const list = kind==='news'?newsSorted():annSorted();
  const item = sel ? list.find(x=>x.id===sel) : null;
  let h=head('Редактор контенту','')+'<section class="sec"><div class="wrap"><div class="ed"><div>'+
    '<div class="panel"><h3>Матеріали</h3>'+
    '<div class="tabs" style="margin-bottom:12px">'+
      '<button data-k="news" class="'+(kind==='news'?'on':'')+'">Новини</button>'+
      '<button data-k="ann" class="'+(kind==='ann'?'on':'')+'">Анонси</button></div>'+
    '<div class="ed-list">'+list.map(x=>'<a href="#" data-sel="'+x.id+'" class="'+(sel===x.id?'on':'')+'">'+
      esc(x.title)+'</a>').join('')+'</div>'+
    '<button class="btn sm primary" id="add" style="width:100%;margin-top:8px">+ Додати</button></div>'+
    '<div class="panel"><h3>Файл даних</h3>'+
      '<button class="btn sm" id="exp" style="width:100%;margin-bottom:8px">Зберегти site-data.json</button>'+
      '<label class="btn sm" style="width:100%;cursor:pointer;justify-content:center">Завантажити файл'+
      '<input type="file" id="imp" accept="application/json" class="hide"></label></div></div><div>';
  if(!item){ h+='<div class="panel"><h3>Матеріал не обрано</h3>'+
    '<p class="dim" style="margin:0">Оберіть матеріал ліворуч або додайте новий.</p></div>'; }
  else if(kind==='news'){
    h+='<div class="panel"><h3>Новина</h3>'+
      '<div class="row"><div><label class="lab">Заголовок</label><input class="fld" data-f="title" value="'+esc(item.title)+'"></div>'+
      '<div><label class="lab">Дата</label><input class="fld" type="date" data-f="date" value="'+esc(item.date||'')+'"></div>'+
      '<div><label class="lab">Рік (для архіву)</label><input class="fld" data-f="year" value="'+esc(item.year||'')+'"></div></div>'+
      '<label class="lab">Короткий опис</label><input class="fld" data-f="lead" value="'+esc(item.lead||'')+'">'+
      '<label class="lab" style="margin-top:10px">Текст — абзаци через порожній рядок</label>'+
      '<textarea class="fld" data-f="body">'+esc((item.body||[]).join('\n\n'))+'</textarea>'+
      '<label class="lab" style="margin-top:10px">Позначка «потребує уточнення»</label>'+
      '<input class="fld" data-f="needsCheck" value="'+esc(item.needsCheck||'')+'">'+
      '<div style="margin-top:14px;display:flex;gap:8px"><button class="btn primary sm" id="save">Зберегти</button>'+
      '<button class="btn danger sm" id="del">Видалити</button></div>'+
      ((item.tables||[]).length?'<div class="note" style="margin-top:14px">Таблиці цього матеріалу ('+
        item.tables.length+') редагуються у файлі site-data.json.</div>':'')+'</div>';
  } else {
    h+='<div class="panel"><h3>Анонс турніру</h3>'+
      '<div class="row"><div><label class="lab">Назва</label><input class="fld" data-f="title" value="'+esc(item.title)+'"></div>'+
      '<div><label class="lab">Початок</label><input class="fld" type="date" data-f="dateStart" value="'+esc(item.dateStart||'')+'"></div>'+
      '<div><label class="lab">Завершення</label><input class="fld" type="date" data-f="dateEnd" value="'+esc(item.dateEnd||'')+'"></div></div>'+
      '<div class="row"><div><label class="lab">Місце</label><input class="fld" data-f="place" value="'+esc(item.place||'')+'"></div>'+
      '<div><label class="lab">Дисципліна</label><select class="fld" data-f="discipline">'+
        Object.entries(DISC).map(([k,v])=>'<option value="'+k+'"'+(item.discipline===k?' selected':'')+'>'+v+'</option>').join('')+
      '</select></div></div>'+
      '<label class="lab">Формат</label><input class="fld" data-f="format" value="'+esc(item.format||'')+'">'+
      '<label class="lab" style="margin-top:10px">Учасники / вікова категорія</label>'+
      '<input class="fld" data-f="ageCat" value="'+esc(item.ageCat||'')+'">'+
      '<label class="lab" style="margin-top:10px">Короткий опис</label>'+
      '<textarea class="fld" data-f="lead" style="min-height:80px">'+esc(item.lead||'')+'</textarea>'+
      '<label class="lab" style="margin-top:10px">Посилання на регламент</label>'+
      '<input class="fld" data-f="regulation" value="'+esc(item.regulation||'')+'">'+
      '<div style="margin-top:14px;display:flex;gap:8px"><button class="btn primary sm" id="save">Зберегти</button>'+
      '<button class="btn danger sm" id="del">Видалити</button></div></div>';
  }
  return h+'</div></div></div></section>';
}

/* ---------------- події ---------------- */
function bind(r){
  $$('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();location.hash=b.dataset.go;});
  if(r.route!=='editor') return;
  const go=$('#go');
  if(go){ const f=()=>{ if($('#pw').value.trim()==='odesa'){OK=true;render();} else toast('Невірний код'); };
    go.onclick=f; $('#pw').onkeydown=e=>{if(e.key==='Enter')f();}; return; }
  $$('[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;sel=null;render();});
  $$('[data-sel]').forEach(a=>a.onclick=e=>{e.preventDefault();sel=a.dataset.sel;render();});
  const add=$('#add');
  if(add) add.onclick=()=>{
    if(kind==='news'){ const n={id:uid('n'),date:new Date().toISOString().slice(0,10),
      year:String(new Date().getFullYear()),title:'Нова новина',lead:'',body:[],tables:[],photos:[],needsCheck:''};
      DATA.news.unshift(n); sel=n.id; }
    else { const a={id:uid('a'),title:'Новий анонс',dateStart:new Date().toISOString().slice(0,10),
      dateEnd:'',place:DATA.contacts.address,discipline:'classic',format:'',ageCat:'',lead:'',regulation:'',newsId:''};
      DATA.announcements.unshift(a); sel=a.id; }
    render();
  };
  const list=kind==='news'?DATA.news:DATA.announcements;
  const item=list.find(x=>x.id===sel);
  const save=$('#save');
  if(save&&item) save.onclick=()=>{
    $$('[data-f]').forEach(el=>{
      if(el.dataset.f==='body') item.body=el.value.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
      else item[el.dataset.f]=el.value;
    });
    if(kind==='news'&&item.date) item.year=item.date.slice(0,4);
    render(); toast('Збережено. Не забудьте вивантажити site-data.json');
  };
  const del=$('#del');
  if(del&&item) del.onclick=()=>{
    if(!confirm('Видалити «'+item.title+'»?')) return;
    const arr=kind==='news'?'news':'announcements';
    DATA[arr]=DATA[arr].filter(x=>x.id!==item.id); sel=null; render(); toast('Видалено');
  };
  const exp=$('#exp');
  if(exp) exp.onclick=()=>{
    const b=new Blob([JSON.stringify(DATA,null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='site-data.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),800);
  };
  const imp=$('#imp');
  if(imp) imp.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{ try{ const d=JSON.parse(fr.result);
        Object.keys(d).forEach(k=>DATA[k]=d[k]); sel=null; render(); toast('Дані завантажено'); }
      catch(err){ toast('Файл пошкоджено'); } };
    fr.readAsText(f);
  };
}
