<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шахова Одеса — новини й турніри</title>
<meta name="description" content="Шахова Одеса: новини, анонси турнірів та архів шахового життя Одеси.">
<meta name="theme-color" content="#FBF8F2">
<meta name="apple-mobile-web-app-title" content="Шахова Одеса">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Onest:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg-2:#F5F6F8; --bg-3:#EDEFF2;
  --line:#E4E7EB; --line-2:#CDD4DB;
  --ink:#141A21; --ink-2:#5B6773; --ink-3:#8B95A1;
  --grn:#1F6F4A; --grn-d:#175539; --grn-l:#EAF3EE;
  --warn:#8A6A12; --warn-l:#FFF8E6; --warn-b:#F0E3BE;
  --r:10px; --sh:0 1px 2px rgba(20,26,33,.05); --sh-2:0 6px 22px rgba(20,26,33,.09);
  --wrap:1140px; --hd:66px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 16.5px/1.68 'Manrope',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--grn);outline-offset:2px}
::selection{background:var(--grn);color:#fff}
h1,h2,h3{font-family:'Onest',sans-serif;letter-spacing:-.02em;margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px;width:100%}
.sec{padding:50px 0}
.sec.grey{background:var(--bg-2)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.dim{color:var(--ink-2)}
.hide{display:none !important}

header.top{position:sticky;top:0;z-index:60;height:var(--hd);background:rgba(255,255,255,.93);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{height:100%;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;flex-shrink:0;object-fit:contain;display:block}
.brand b{font-family:'Onest',sans-serif;font-weight:700;font-size:16px;white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{padding:9px 13px;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink-2);
  white-space:nowrap;transition:.15s}
.nav a:hover{background:var(--bg-2);color:var(--ink)}
.nav a.on{background:var(--grn-l);color:var(--grn-d);font-weight:600}
.burger{display:none;width:42px;height:42px;margin-left:auto;border:1px solid var(--line);
  background:#fff;border-radius:8px;cursor:pointer;place-items:center}
.drawer{position:fixed;inset:var(--hd) 0 0;background:#fff;z-index:55;display:none;padding:10px 0;overflow:auto}
.drawer.open{display:block}
.drawer a{display:block;padding:16px 22px;font-family:'Onest';font-size:17px;font-weight:600;
  border-bottom:1px solid var(--line)}

.hero{position:relative;padding:64px 0 52px;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::after{content:"";position:absolute;right:-60px;top:-50px;width:500px;height:500px;
  background-image:repeating-conic-gradient(var(--grn-l) 0% 25%,transparent 0% 50%);
  background-size:110px 110px;
  mask-image:radial-gradient(closest-side,#000,transparent);
  -webkit-mask-image:radial-gradient(closest-side,#000,transparent);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:clamp(36px,6.8vw,70px);font-weight:800;line-height:1.03;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--grn)}
.hero p{margin:18px 0 0;font-size:clamp(16px,2vw,19px);color:var(--ink-2);max-width:54ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(22px,3vw,30px);font-weight:700}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--grn);display:block;margin-bottom:7px}
.link{font-size:15px;font-weight:600;color:var(--grn)}
.link:hover{color:var(--grn-d);text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;
  border:1px solid var(--line-2);background:#fff;border-radius:9px;cursor:pointer;
  font-size:15px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--grn);color:var(--grn)}
.btn.primary{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.primary:hover{background:var(--grn-d);border-color:var(--grn-d);color:#fff}
.btn.danger{color:#B3392F;border-color:#E6C6C2}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:8px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:var(--sh);transition:.18s;display:block}
a.card:hover{box-shadow:var(--sh-2);transform:translateY(-2px);border-color:var(--line-2)}
.card h3{font-size:18px;font-weight:600;line-height:1.35;margin:10px 0 8px}
.card p{margin:0;font-size:15px;color:var(--ink-2)}
.card .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-3)}
.card .more{display:inline-block;margin-top:12px;font-size:14.5px;font-weight:600;color:var(--grn)}
.thumb{aspect-ratio:16/9;background:var(--bg-3);border-radius:8px;overflow:hidden;
  display:grid;place-items:center;margin-bottom:14px}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:#A9B2BC}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
  font-size:12.5px;font-weight:600;background:var(--grn-l);color:var(--grn-d)}
.badge.past{background:var(--bg-3);color:var(--ink-2)}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:24px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 17px;border:1px solid var(--line);background:#fff;border-radius:99px;
  cursor:pointer;font-size:15px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:.15s}
.tabs button:hover{border-color:var(--line-2)}
.tabs button.on{background:var(--grn);border-color:var(--grn);color:#fff}

.tbl-wrap{border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;background:#fff;
  box-shadow:var(--sh);margin-bottom:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
table.tbl th{text-align:left;padding:12px 14px;background:var(--bg-2);border-bottom:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--line)}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--bg-2)}
.n{font-family:'IBM Plex Mono',monospace;color:var(--ink-2)}
tr.top td:first-child{color:var(--grn);font-weight:600}
.tbl-cap{font-family:'Onest';font-weight:600;font-size:15px;margin:22px 0 8px}

.page-head{background:var(--bg-2);border-bottom:1px solid var(--line);padding:40px 0 34px}
.page-head h1{font-size:clamp(27px,4.4vw,42px);font-weight:800}
.page-head p{margin:12px 0 0;color:var(--ink-2);max-width:68ch;font-size:17px}
.crumbs{font-size:14px;color:var(--ink-3);margin-bottom:12px}
.crumbs a:hover{color:var(--grn)}
.article{max-width:760px}
.article p{margin:0 0 17px;font-size:17.5px;line-height:1.78}
.article p.lead{font-size:19px;font-weight:500;color:var(--ink)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.info div{background:#fff;padding:14px 16px}
.info span{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.info b{font-weight:600;font-size:15.5px}
.note{background:var(--bg-2);border-left:3px solid var(--grn);border-radius:0 8px 8px 0;
  padding:13px 16px;font-size:15px;color:var(--ink-2);margin:14px 0}
.warn{background:var(--warn-l);border:1px solid var(--warn-b);border-left:3px solid #D6A83A;
  border-radius:0 8px 8px 0;padding:13px 16px;font-size:15px;color:var(--warn);margin:16px 0}
.warn b{display:block;margin-bottom:4px;font-family:'Onest';font-size:14px}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:32px 22px;text-align:center;
  background:var(--bg-2)}
.empty b{display:block;font-family:'Onest';font-size:16px;margin-bottom:6px}
.empty span{font-size:15px;color:var(--ink-2)}
.photo{margin:20px 0}
.photo figcaption{font-size:14px;color:var(--ink-3);margin-top:8px}
iframe.map{width:100%;height:380px;border:1px solid var(--line);border-radius:var(--r)}
.article h3{font-size:20px;font-weight:700;margin:30px 0 12px}
.article ul{margin:0 0 17px;padding-left:22px;font-size:17.5px;line-height:1.7}
.src{font-size:14px;color:var(--ink-3);margin:26px 0 0;max-width:760px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0 8px}
.gal button{padding:0;border:0;background:var(--bg-3);border-radius:8px;overflow:hidden;cursor:zoom-in;aspect-ratio:1/1}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.gal button:hover img{transform:scale(1.04)}
.scans{display:grid;gap:18px;margin:12px 0}
.scans figure{margin:0;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:10px;box-shadow:var(--sh)}
.scans button{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.scans img{margin:0 auto;max-height:80vh;width:auto}
.scans figcaption{font-size:14px;color:var(--ink-2);margin-top:8px}
.lb{position:fixed;inset:0;z-index:90;background:rgba(10,14,18,.93);display:flex;align-items:center;justify-content:center}
.lb img{max-width:94vw;max-height:84vh;object-fit:contain;border-radius:6px;background:#fff}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.16);color:#fff;width:46px;height:46px;
  border-radius:50%;font-size:24px;line-height:1;cursor:pointer}
.lb .x{top:14px;right:14px}
.lb .pv{left:12px;top:50%;transform:translateY(-50%)}
.lb .nx{right:12px;top:50%;transform:translateY(-50%)}
.lb .cnt{position:absolute;bottom:14px;left:16px;right:16px;text-align:center;color:#CFD6DD;font-size:14px}
.res h3{margin:10px 0 8px}
.pod{margin:4px 0 0}
.pod .g{font-size:13px;color:var(--ink-3);margin:10px 0 3px;font-weight:600}
.pod .p{display:flex;gap:10px;align-items:baseline;font-size:15px;padding:2px 0}
.pod .m{font-family:'IBM Plex Mono',monospace;color:var(--ink-3);min-width:24px}
.pod .p1 .m{color:var(--grn);font-weight:600}
.pod .p1 b{font-weight:700}
.pod .pts{margin-left:auto;font-family:'IBM Plex Mono',monospace;color:var(--ink-3);font-size:13.5px;white-space:nowrap}
.disc{display:inline-block;font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;padding:3px 9px;
  border-radius:99px;background:var(--bg-3);color:var(--ink-2);letter-spacing:0}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:var(--sh);margin-bottom:16px}
.panel>h3{font-size:16px;font-weight:700;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
label.lab{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.fld{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  font-size:15px;width:100%}
.fld:focus{border-color:var(--grn);outline:none}
textarea.fld{min-height:120px;resize:vertical;line-height:1.6}
.ed-list a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  margin-bottom:6px;font-size:14.5px}
.ed-list a.on{border-color:var(--grn);background:var(--grn-l);color:var(--grn-d)}
.ed{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;background:var(--ink);
  color:#fff;padding:12px 20px;border-radius:10px;font-size:15px;box-shadow:var(--sh-2)}

footer{background:var(--bg-2);border-top:1px solid var(--line);padding:40px 0 26px;margin-top:10px}
.f-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:26px}
footer h4{font-size:13.5px;color:var(--ink-3);margin:0 0 10px;font-weight:600}
footer a{display:block;padding:4px 0;font-size:15px;color:var(--ink-2)}
footer a:hover{color:var(--grn)}
.f-bot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-3)}

@media(max-width:1000px){ .nav{display:none} .burger{display:grid} }
@media(max-width:860px){ .g3{grid-template-columns:repeat(2,1fr)} .ed{grid-template-columns:1fr} }
@media(max-width:680px){
  body{font-size:17px}
  .sec{padding:36px 0}
  .g2,.g3{grid-template-columns:1fr}
  .f-grid{grid-template-columns:1fr}
  .hero::after{width:300px;height:300px;right:-110px;opacity:.7}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.tbl{min-width:560px;font-size:15px}
  table.tbl th,table.tbl td{padding:11px 12px;white-space:nowrap}
  table.tbl td:nth-child(2){white-space:normal;min-width:170px}
  iframe.map{height:300px}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
/* редактор */
.ed{grid-template-columns:300px 1fr}
.edbar{position:sticky;top:calc(var(--hd) + 8px);z-index:25;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--sh-2);margin-bottom:16px}
.edbar .st{flex:1;min-width:200px;font-size:14px;color:var(--ink-2)}
.edbar .st b{color:var(--grn-d)}
.edbar .st.dirty b{color:#A45C00}
.btn[disabled],.btn.dis{opacity:.5;cursor:not-allowed}
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menu>div{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--sh-2);padding:6px;min-width:250px;z-index:30}
.menu>div button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:7px;cursor:pointer;font-size:14.5px}
.menu>div button:hover{background:var(--bg-2)}
.ed-tabs{flex-wrap:wrap;margin-bottom:10px;gap:5px}
.ed-tabs button{padding:7px 12px;font-size:14px}
.ed-list{max-height:62vh;overflow:auto}
.ed-list a span{display:block}
.ed-list a small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.panel>h3 small{font-size:13px}
.ed-ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.ed-tile{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ed-tile img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg-3)}
.ed-tile .fld{border:0;border-top:1px solid var(--line);border-radius:0;font-size:13.5px;padding:8px 10px}
.ed-tb{display:flex;border-top:1px solid var(--line)}
.ed-tb button{flex:1;border:0;background:#fff;padding:8px 0;cursor:pointer;font-size:14px;color:var(--ink-2)}
.ed-tb button+button{border-left:1px solid var(--line)}
.ed-tb button:hover{background:var(--bg-2);color:var(--ink)}
.ed-tb button.x:hover{color:#B3392F}
.ed-box{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--bg-2)}
.ed-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ed-doc{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ed-doc .fld{flex:1}
.ed-hist{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
textarea.mono{font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.55;white-space:pre;overflow:auto;tab-size:14}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;margin:10px 0 4px;cursor:pointer}
.chk input{margin-top:5px;width:16px;height:16px;flex-shrink:0;accent-color:var(--grn)}
.hint{font-size:13px;color:var(--ink-3);margin:6px 0 0;line-height:1.5}
.prog{font-size:14px;color:var(--grn);margin:6px 0 0;min-height:1px}
.lab.req::after{content:" *";color:#B3392F}
.edpill{position:fixed;left:16px;bottom:16px;z-index:70;background:var(--ink);color:#fff;border-radius:99px;padding:11px 16px;
  font-size:14px;font-weight:600;box-shadow:var(--sh-2)}
.edpill:hover{background:#000}
@media(max-width:860px){ .ed{grid-template-columns:1fr} .ed-list{max-height:40vh}
  .edbar{top:calc(var(--hd) + 4px);padding:7px 9px;gap:6px} .edbar .st{flex-basis:100%;min-width:0;font-size:12.5px;line-height:1.35}
  .edbar .btn.sm{padding:7px 12px} }
/* шахісти */
a.pl{color:inherit;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
a.pl:hover{color:var(--grn);text-decoration-color:var(--grn)}
.tit{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;padding:1px 6px;
  border-radius:5px;background:#1F2A35;color:#fff;margin-left:7px;vertical-align:2px;letter-spacing:.04em}
.tit.lg{font-size:13px;padding:3px 9px;margin:0 6px 0 0;vertical-align:1px}
.ptools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ptools input{flex:1;min-width:220px}
.ptools select{width:auto;flex:0 0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chips button{padding:7px 13px;border:1px solid var(--line);background:#fff;border-radius:99px;cursor:pointer;
  font-size:14px;font-weight:600;color:var(--ink-2)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.plist{border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh);overflow:hidden}
.plist>a,.plist>.ph{display:grid;grid-template-columns:1fr repeat(3,78px);gap:10px;align-items:center;padding:11px 16px;
  border-bottom:1px solid var(--line)}
.plist>a:last-child{border-bottom:0}
.plist>a:hover{background:var(--bg-2)}
.plist>.ph{background:var(--bg-2);font-size:12.5px;font-weight:600;color:var(--ink-3);padding-top:9px;padding-bottom:9px}
.plist>.ph span+span{text-align:right}
.plist .nm b{font-weight:600}
.plist .nm small{display:block;font-size:13px;color:var(--ink-3);margin-top:1px}
.plist .r{font-family:'IBM Plex Mono',monospace;text-align:right;font-size:15px}
.plist .r.pr{color:var(--ink-3);font-style:italic}
.plist .r i{display:none;font-style:normal;font-size:11px;color:var(--ink-3);margin-right:4px}
.rcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rc{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:#fff;box-shadow:var(--sh)}
.rc>span{display:block;font-size:13px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.rc>b{display:block;font-family:'Onest',sans-serif;font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:6px 0 4px}
.rc>b.no{color:var(--line-2)}
.rc small{font-size:13px;color:var(--ink-2);line-height:1.45;display:block}
.ach{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0 0}
.ach div{background:var(--bg-2);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.ach b{font-family:'Onest',sans-serif;font-size:24px;display:block;line-height:1.15;color:var(--ink)}
.md{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:99px;font-size:12.5px;
  font-weight:700;font-family:'IBM Plex Mono',monospace;color:#fff}
.md1{background:#C9971A}.md2{background:#8F9BA8}.md3{background:#B0703A}
.titles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.titles a{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);
  background:linear-gradient(100deg,#FFF5D6,#FFFDF6 70%);border:1px solid #EFDFAE;transition:.15s}
.titles a:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.titles .cr{font-size:28px;line-height:1;color:#B8860B}
.titles b{display:block;font-family:'Onest',sans-serif;font-size:16px}
.titles small{display:block;font-size:13px;color:var(--ink-2);line-height:1.4}
.chart{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:12px 10px 4px;box-shadow:var(--sh)}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:'IBM Plex Mono',monospace;font-size:11.5px;fill:var(--ink-3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);padding:8px 8px 6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.f{height:0;border-top:2px dashed var(--ink-3);background:none}
.ptbl td small{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
.ptbl td .disc{margin-left:6px}
table.ctbl td{vertical-align:top}
table.ctbl td.y{font-family:'Onest',sans-serif;font-weight:700;font-size:17px;width:72px}
table.ctbl .cr{color:#B8860B;margin-right:6px}
table.ctbl .none{color:var(--line-2)}
.ycards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.ycards .card h3{display:flex;align-items:baseline;gap:10px}
.ycards .card h3 span{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-3);font-weight:500}
.yrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.yrow:last-child{border-bottom:0}
.yrow span{color:var(--ink-3);font-size:13.5px;min-width:46%}
@media(max-width:860px){ .ycards{grid-template-columns:1fr} }
@media(max-width:680px){
  .plist>.ph{display:none}
  .plist>a{grid-template-columns:repeat(3,1fr);gap:4px 10px;padding:12px 14px}
  .plist .nm{grid-column:1/-1}
  .plist .r{text-align:left;font-size:14px}
  .plist .r i{display:inline}
  .rcards{grid-template-columns:repeat(3,1fr);gap:8px}
  .rc{padding:12px}
  .rc>b{font-size:26px}
  .rc>span{font-size:11px;letter-spacing:.04em}
  .rc small{font-size:12px}
  table.ptbl{min-width:0}
  table.ptbl td:nth-child(2){min-width:190px}
}
/* дизайн: турнірний зал */
:root{
  --bg:#FBF8F2; --bg-2:#F3EDE2; --bg-3:#E9E1D2; --line:#E6DCCB; --line-2:#D4C6AE;
  --ink:#17201B; --ink-2:#56605A; --ink-3:#8B918B;
  --grn:#1E5A40; --grn-d:#123D2B; --grn-l:#E6EEE7;
  --night:#0F2E22; --ivory:#F4EEE2; --ivory-2:#C3CFC6;
  --gold:#C9A24A; --gold-d:#8A6A1E; --gold-l:#F5EAD0;
  --sh:0 1px 2px rgba(23,32,27,.05); --sh-2:0 12px 32px rgba(23,32,27,.11);
}
body{background:var(--bg)}
h1,h2,h3,.brand b,.tbl-cap,.panel>h3{font-family:'Playfair Display',Georgia,'Times New Roman',serif;letter-spacing:-.005em}
.sec-head h2{font-weight:700}
.card h3{font-weight:600;font-size:19px}
.eyebrow{color:var(--gold-d);letter-spacing:.16em}
::selection{background:var(--gold);color:#1E1708}
:focus-visible{outline-color:var(--gold-d)}
header.top{background:rgba(251,248,242,.94);border-bottom-color:var(--line)}
.brand b{font-size:19px;font-weight:700}
.nav a:hover{background:var(--bg-2)}
.nav a.on{background:var(--night);color:var(--ivory);font-weight:600}
.burger,.drawer{background:var(--bg)}
.drawer a{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:600;border-bottom-color:var(--line)}
.hero{background:var(--night);color:var(--ivory);padding:0;border-bottom:0}
.hero::after{display:none}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background-image:repeating-conic-gradient(var(--gold) 0% 25%,transparent 0% 50%);background-size:72px 72px;
  -webkit-mask-image:linear-gradient(100deg,transparent 40%,#000 100%);mask-image:linear-gradient(100deg,transparent 40%,#000 100%)}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-top:64px;padding-bottom:40px}
.hero .eyebrow{color:var(--gold)}
.hero h1{font-size:clamp(46px,7vw,86px);font-weight:700;line-height:1;letter-spacing:-.01em;margin-top:8px}
.hero p{color:var(--ivory-2);max-width:44ch}
.hero .cta{margin-top:30px}
.btn{border-color:var(--line-2);background:#fff}
.btn:hover{border-color:var(--gold-d);color:var(--gold-d)}
.btn.primary{background:var(--night);border-color:var(--night);color:#fff}
.btn.primary:hover{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1E1708}
.btn.gold:hover{background:#D8B45E;border-color:#D8B45E;color:#1E1708}
.btn.ghost{background:transparent;border-color:rgba(244,238,226,.35);color:var(--ivory)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.hero-ph{margin:0;position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/5;max-height:470px;width:100%;
  box-shadow:0 30px 60px rgba(0,0,0,.35);outline:1px solid rgba(201,162,74,.4);outline-offset:8px}
.hero-ph img{width:100%;height:100%;object-fit:cover;object-position:50% 72%}
.hero-ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:32px 16px 12px;font-size:13px;color:var(--ivory);
  background:linear-gradient(transparent,rgba(8,22,16,.85))}
.hero-ph figcaption a:hover{color:var(--gold)}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(201,162,74,.3)}
.hstats a{padding:22px 18px 28px 0}
.hstats a+a{padding-left:22px;border-left:1px solid rgba(244,238,226,.12)}
.hstats b{display:block;font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-size:clamp(30px,4vw,46px);font-weight:700;color:var(--gold);line-height:1}
.hstats span{display:block;margin-top:8px;font-size:14px;color:var(--ivory-2)}
.hstats a:hover span{color:var(--ivory)}
.page-head{background:var(--night);color:var(--ivory);border-bottom:0;position:relative;overflow:hidden}
.page-head::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;
  background-image:repeating-conic-gradient(var(--gold) 0% 25%,transparent 0% 50%);background-size:72px 72px;
  -webkit-mask-image:linear-gradient(100deg,transparent 40%,#000 100%);mask-image:linear-gradient(100deg,transparent 40%,#000 100%)}
.page-head .wrap{position:relative}
.page-head h1{font-weight:700}
.page-head p,.page-head .dim,.page-head .crumbs,.page-head .crumbs a{color:var(--ivory-2)}
.page-head .crumbs a:hover{color:var(--gold)}
.page-head .badge,.page-head .badge.past{background:rgba(244,238,226,.12);color:var(--ivory)}
.page-head .tit{background:var(--gold);color:#1E1708}
.sec.grey{background:var(--bg-2)}
.card{border-color:var(--line);border-radius:14px}
a.card:hover{border-color:var(--gold)}
.thumb{background:var(--bg-3);border-radius:10px}
.thumb span{color:#B9AE98}
.thumb.noph{background:var(--night);position:relative}
.thumb.noph::before{content:"";position:absolute;inset:0;opacity:.07;background-image:repeating-conic-gradient(var(--gold) 0% 25%,transparent 0% 50%);background-size:36px 36px}
.thumb.noph span{position:relative;font-family:Georgia,serif;font-size:56px;letter-spacing:0;color:var(--gold)}
.thumb.noph em{position:absolute;right:14px;bottom:10px;font-style:normal;font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-size:16px;color:rgba(244,238,226,.55);letter-spacing:.02em}
.badge{background:var(--grn-l);color:var(--grn-d)}
.badge.past{background:var(--bg-3);color:var(--ink-2)}
.tabs button{background:#fff;border-color:var(--line)}
.tabs button.on,.chips button.on{background:var(--night);border-color:var(--night);color:var(--ivory)}
.tbl-wrap{border-color:var(--line);border-radius:14px}
table.tbl th{background:var(--bg-2)}
table.tbl tbody tr:hover{background:#FAF5EC}
tr.top td:first-child{color:var(--gold-d)}
.tbl-cap{font-size:19px;font-weight:600}
.pod .p1 .m{color:var(--gold-d)}
table.ctbl .cr,.titles .cr{color:var(--gold)}
table.ctbl td.y{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
.titles a{background:var(--gold-l);border-color:#E9D8AA}
.tit{background:var(--night)}
.tit.fed{background:transparent;color:var(--ink-2);border:1px solid var(--line-2)}
.rc>b,.ach b{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:700}
.md1{background:var(--gold)}
.note{border-left-color:var(--gold)}
.empty{background:var(--bg-2);border-color:var(--line-2)}
.panel{border-color:var(--line);border-radius:14px}
.fld{border-color:var(--line-2)}
.fld:focus{border-color:var(--gold-d)}
footer{background:var(--night);border-top:0;color:var(--ivory)}
footer .dim{color:var(--ivory-2)}
footer h4{color:var(--gold);letter-spacing:.06em}
footer a{color:var(--ivory-2)}
footer a:hover{color:var(--gold)}
footer .brand b{color:var(--ivory)}
.f-bot{border-top-color:rgba(244,238,226,.12);color:var(--ivory-2)}
@media(max-width:860px){
  .hero-in{grid-template-columns:1fr;gap:30px;padding-top:44px;padding-bottom:26px}
  .hero-ph{aspect-ratio:16/10;max-height:none}
  .hstats{grid-template-columns:repeat(2,1fr)}
  .hstats a,.hstats a+a{padding:16px 14px 18px 0;border-left:0}
  .hstats a:nth-child(even){padding-left:16px;border-left:1px solid rgba(244,238,226,.12)}
  .hstats a:nth-child(n+3){border-top:1px solid rgba(244,238,226,.12)}
}
@media(max-width:680px){ .hero h1{font-size:50px} .hstats b{font-size:34px} .hstats span{font-size:13.5px} }
/* рух: шаховий космос */
.cosmos{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
.hero.has-cosmos::before,.page-head.has-cosmos::before{display:none}
.page-head .wrap{position:relative;z-index:1}
.hero::after{display:block;content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(460px circle at var(--gx,70%) var(--gy,40%),rgba(217,180,92,.10),transparent 62%)}
.hero-in{transform:translate3d(0,calc(var(--sy,0) * .18px),0);opacity:calc(1 - var(--sy,0) / 900)}
h1.split .w{display:inline-block;white-space:nowrap}
h1.split .ch{display:inline-block;opacity:0;transform:translateY(.55em) rotateX(-70deg);filter:blur(6px);
  animation:chIn .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i) * 55ms + 150ms)}
@keyframes chIn{to{opacity:1;transform:none;filter:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}}
@keyframes fadeIn{to{opacity:1}}
.hero .eyebrow{animation:fadeUp .8s .05s both}
.hero-in p{animation:fadeUp .9s .55s both}
.hero .cta{animation:fadeUp .9s .75s both}
.hstats{animation:fadeUp 1s .95s both}
@property --fy{syntax:'<length>';inherits:false;initial-value:0px}
.hero-ph{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--fy,0px));
  transition:transform .3s ease-out;will-change:transform;animation:phIn 1.1s .3s cubic-bezier(.2,.8,.2,1) backwards,float 7s 1.5s ease-in-out infinite}
.hero-ph.tilting{transition:transform .08s linear}
@keyframes phIn{from{opacity:0;transform:perspective(900px) rotateY(-18deg) translateX(40px) scale(.94)}}
@keyframes float{0%,100%{--fy:0px}50%{--fy:-10px}}
.hero-ph::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,rgba(255,240,200,.30) 48%,transparent 62%);background-size:260% 100%;
  background-position:var(--sx,120%) 0;opacity:0;animation:sheen 7s 2.6s infinite}
.hero-ph.tilting::after{opacity:1;animation:none}
@keyframes sheen{0%{background-position:160% 0;opacity:0}8%{opacity:1}30%{background-position:-60% 0;opacity:0}100%{opacity:0}}
.btn.gold{position:relative;overflow:hidden}
.btn.gold::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 5s 2.2s infinite}
@keyframes shine{0%{left:-60%}22%,100%{left:130%}}
.rv{opacity:0;transform:translate3d(0,22px,0) scale(.985);
  transition:opacity .7s cubic-bezier(.2,.8,.2,1) var(--d,0ms),transform .8s cubic-bezier(.2,.8,.2,1) var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.chart path.drawn{stroke-dasharray:1;stroke-dashoffset:1}
.chart.anim.in path.drawn,.chart.anim:not(.rv) path.drawn{animation:draw 1.8s .15s cubic-bezier(.4,.1,.2,1) forwards}
.chart.anim circle{opacity:0}
.chart.anim.in circle,.chart.anim:not(.rv) circle{animation:fadeIn .5s 1.5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
header.top{view-transition-name:topbar}
::view-transition-old(topbar),::view-transition-new(topbar){animation:none}
@keyframes vtOut{to{opacity:0;transform:translateY(-8px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(14px)}}
::view-transition-old(root){animation:vtOut .2s ease both}
::view-transition-new(root){animation:vtIn .36s cubic-bezier(.2,.8,.2,1) both}
a.card,.titles a,.plist>a,.hstats a{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s,background .2s}
a.card:hover{transform:translateY(-4px)}
.hstats a:hover b{text-shadow:0 0 18px rgba(217,180,92,.55)}
/* перший екран зі справжнім фото */
.hero-photo{min-height:min(84vh,780px);display:flex;flex-direction:column;justify-content:center}
.hero-photo .hero-in{grid-template-columns:minmax(0,660px);padding-top:56px;padding-bottom:92px}
.hero-photo h1{text-shadow:0 2px 26px rgba(5,20,14,.5)}
.hero-photo .hero-in p{color:#E6EEE8;text-shadow:0 1px 14px rgba(5,20,14,.55)}
.hero .hero-credit{position:absolute;right:16px;bottom:10px;z-index:1;margin:0;max-width:none;font-size:11px;color:rgba(244,238,226,.66)}
.hero-credit a{color:inherit;text-decoration:underline;text-decoration-color:rgba(244,238,226,.35);text-underline-offset:2px}
.hero-credit a:hover{color:var(--gold)}
.hero-photo .btn.ghost{background:rgba(10,32,24,.38);border-color:rgba(244,238,226,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero-photo .btn.ghost:hover{background:rgba(10,32,24,.55)}
@media(max-width:860px){ .hero-photo{min-height:min(88vh,720px)} .hero-photo .hero-in{grid-template-columns:1fr;padding-bottom:110px}
  .hero .hero-credit{left:16px;right:16px;text-align:right} }
/* сузір'я «Кінь» у підвалі */
footer.has-sky{position:relative;overflow:hidden}
footer.has-sky>.wrap{position:relative;z-index:1}
canvas.sky{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
/* перехід «шахова дошка» (~3 с: накриває 1 с, тримається 0,9 с, відкриває 1 с; клік — пропустити) */
.wave{position:fixed;inset:0;z-index:150;display:grid;pointer-events:none;visibility:hidden;--cell:260ms;--spread:240ms}
.wave.fast{--cell:220ms;--spread:130ms}
.wave i{display:block;transform:scale(0)}
.wave i.l{background:#163E2E}.wave i.d{background:#0F2E22}
.wave.cover,.wave.hold,.wave.reveal{visibility:visible}
.wave.cover,.wave.hold{pointer-events:auto;cursor:pointer}
.wave.cover i{animation:cellIn var(--cell) cubic-bezier(.6,0,.3,1) calc(var(--f) * var(--spread)) forwards}
.wave.hold i{transform:none;animation:glint .45s ease-in-out calc(var(--f) * 180ms) both}
.wave.reveal i{transform:none;animation:cellOut var(--cell) cubic-bezier(.6,0,.3,1) calc(var(--f) * var(--spread)) forwards}
@keyframes cellIn{from{transform:scale(0) rotate(45deg);opacity:.4}to{transform:none;opacity:1}}
@keyframes cellOut{from{transform:none}to{transform:scale(0) rotate(-45deg);opacity:.3}}
@keyframes glint{0%,100%{box-shadow:inset 0 0 0 0 rgba(217,180,92,0)}45%{box-shadow:inset 0 0 0 200px rgba(217,180,92,.2)}}
.wave b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);font:400 72px Georgia,serif;color:var(--gold);opacity:0;
  text-shadow:0 0 24px rgba(217,180,92,.6)}
.wave.cover b{animation:crest .3s .26s forwards}
.wave.hold b{opacity:1;transform:translate(-50%,-50%);animation:crestPulse .5s ease-in-out}
/* редактор сайту поки лише для автора: посилання в підвалі сховано, вхід — за адресою /#/editor */
footer a[href="#/editor"]{display:none}
.wave.reveal b{opacity:1;transform:translate(-50%,-50%);animation:crestOut .35s forwards}
.wave.reveal.fast b{animation-duration:.15s}
@keyframes crest{to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes crestPulse{50%{transform:translate(-50%,-50%) scale(1.18);text-shadow:0 0 42px rgba(242,210,122,.95)}}
@keyframes crestOut{to{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
/* інтро: корона з частинок (раз за візит) */
#intro{position:fixed;inset:0;z-index:300;cursor:pointer;transition:opacity .42s ease}
#intro canvas{display:block;width:100%;height:100%}
#intro.out{opacity:0;pointer-events:none}
body.intro-wait .hero .ch,body.intro-wait .hero .eyebrow,body.intro-wait .hero-in p,body.intro-wait .hero .cta,
body.intro-wait .hstats,body.intro-wait .hero-ph{animation-play-state:paused}
/* «Зала чемпіонів»: корони спалахують іскрами */
table.ctbl .cr,.titles .cr{display:inline-block;transition:transform .25s cubic-bezier(.2,.8,.2,1),text-shadow .25s}
table.ctbl td:hover .cr,.titles a:hover .cr{transform:scale(1.4) rotate(-10deg);text-shadow:0 0 14px rgba(217,180,92,.95)}
.sparks{position:fixed;width:0;height:0;z-index:120;pointer-events:none}
.sparks i{position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:#F2D27A;
  box-shadow:0 0 6px 1px rgba(242,210,122,.85);animation:spark .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* рейтинг шахіста: зміна за рік */
.dlt{display:inline-block;margin-left:6px;font-style:normal;font-weight:700;font-size:12px;padding:1px 7px;border-radius:99px;white-space:nowrap}
.dlt.up{color:#1E5A40;background:#E1EFE4}.dlt.down{color:#9B2C2C;background:#F7E3DF}.dlt.eq{color:var(--ink-3);background:var(--bg-2)}
@media(max-width:680px){ .rcards{grid-template-columns:repeat(3,minmax(0,1fr))} .dlt{display:inline-block;margin:4px 0 0;font-size:11px;padding:1px 5px;white-space:normal} }
</style>

   "body": ["Чемпіонат Одеської області з блискавичної гри проведено 28 березня 2026 року за адресою: м. Одеса, вул. Канатна, 95, з обрахуванням міжнародних рейтингів.","Реєстрація — 28 березня з 10.00 до 10.45, початок усіх турів об 11.00. Змагання проходило за швейцарською системою у 9 турів, контроль часу — 3 хвилини кожному учаснику з додаванням 2 секунд після зробленого ходу, починаючи з першого.","Призовий фонд блискавичної гри — 18 000 грн: 4 000, 2 500, 2 000, 1 500 і 1 500 грн в основному заліку та п’ять категорійних призів по 800 і 500 грн.","Загальне керівництво проведенням змагань здійснювали управління фізичної культури та спорту Одеської обласної державної адміністрації, Федерація шахів Одеської області та Об’єднання шахово-шашкових клубів Одеської області. Регламент затвердив голова Об’єднання Ігор Горбунов.","До участі допускалися шахісти I розряду та вище. Вступний внесок у вигляді добровільних пожертвувань: швидка гра — 200 грн, блискавична — 100 грн; гросмейстери, міжнародні майстри, майстри спорту України та ветерани 65+ — без внеску.","Категорії призів: ветерани 65+ (1961 р.н. та старші), ветерани 50+ (1976 р.н. та старші), жінки, юнаки 2007 р.н. та молодші, рейтинг ФІДЕ до 2000. Головний суддя — Богданов Валентин Фомич, укриття — вул. Канатна, 99."],

   "title": "Привітання Володимиру Тукмакову з ювілеєм",
   "lead": "Шахісти Одещини привітали Володимира Борисовича Тукмакова — віце-чемпіона світу серед юнаків, срібного призера чемпіонатів СРСР, «Заслуженого тренера ФІДЕ».",
   "body": ["Шановний Володимире Борисовичу!","Тисячі шахістів/ток та любителів древньої мудрої гри Одещини щиро вітають Вас з ювілеєм!","Ваш спортивний шлях сміливо можна назвати історичним. До світової шахової еліти Ви увійшли в ті часи, коли ще активно діяла плеяда видатних Майстрів, справжніх класиків.","Майстром спорту СРСР Ви стали у 1962 р., маючи 16 років. Зараз таким досягненням нікого не здивуєш, гросмейстерами стають навіть дванадцятирічні. Але не будемо забувати, що в ті часи не було комп’ютерів, і шахову премудрість доводилося опановувати виснажливою самостійною працею. Показово, що перед Вами подібного успіху досягали лише двоє — Михайло Ботвинник і Борис Спаський — майбутні чемпіони світу.","Ви були віце-чемпіоном світу серед юнаків, тричі ставали срібним призером чемпіонатів СРСР, які вважалися найсильнішими турнірами у світі.","У складі збірної СРСР перемагали на чемпіонатах Європи 1973 та 1983 рр., на Всесвітній шаховій Олімпіаді — 1984.","Вже в ті часи яскраво проявився Ваш талант лідера у командних змаганнях. Маючи такий досвід, Ви після закінчення активної кар’єри гравця стали блискучим тренером. Під Вашим керівництвом чоловіча збірна України двічі перемагала на Всесвітніх шахових олімпіадах, стала призером світового чемпіонату.","Ця грань Вашого обдарування знайшла достойне визнання: Ви є «Заслуженим тренером ФІДЕ», а у 2010 р. Вас було визнано найкращим тренером ФІДЕ.","Чудово виявили Ви себе і як шаховий літератор; у Ваших книгах поєднується цікавість викладу з глибиною аналізу.","А для нас важливо те, що Ви залишилися вірним своєму рідному місту, тож ми вважаємо, що Володимир Тукмаков — взірець справжнього одесита.","Ваш спортивний та життєвий шлях — чудовий приклад для молодих талантів, якими Одесу та Одещину ніколи не було обділено.","Тож, Володимире Борисовичу, здоров’я Вам і якомога більше радощів!","А ми пишаємося тим, що маємо честь бути Вашими сучасниками."],

   "title": "Чемпіонати Одеської області з шахів серед юнаків та дівчат до 12 і 14 років (2026)",
   "lead": "Переможцями стали Діана Зубрицька (дівчата до 12 років), Максим Хмельовський (хлопці до 12 років) і Володимир Кузьмій (хлопці до 14 років).",
   "body": ["Пройшли чемпіонати Одеської області з шахів серед хлопчіков та дівчаток до 12 та 14 років.","Переможцями стали:","Дівчатка до 12 років","• Зубрицька Діана;","• Лавриненко Олена;","• Письменнова Дар’я.","Хлопчики до 12 років","• Хмельовський Максим;","• Шихавцов Даніїл;","• Вододюк Іван.","Хлопчики до 14 років","• Кузьмій Володимир;","• Андрєєв Андрій;","• Саакян Арам.","## Анонс змагань","З 7 по 21 лютого 2026 року у приміщенні Об’єднання шахово-шашкових клубів (вул. Канатна, 95) проводяться чемпіонати Одеської області з шахів серед юнаків та дівчат до 12, 14 років.","До участі допускаються гравці 2014 р.н. та молодше у чемпіонати до 12 років та гравці 2012 р.н. та молодше у чемпіонати до 14 років.","Реєстрація – 7 лютого о 10-00.","Турові дні: 7, 8, 14, 15, 21 лютого 2026 р.","Початок турів – 10.00.","При собі мати кваліфікаційний квиток, який підтверджує діючий розряд."],

   "lead": "Найсильніше місцеве змагання за останні роки: 56 шахістів, 11 турів, пряма трансляція партій. Переміг міжнародний майстер Віктор Скляров.",
   "body": ["29 листопада 2025 року в головному обласному шаховому клубі на вул. Канатній, 95 відбулося фінальне змагання з блискавичної гри, присвячене 100-річчю від дня народження видатного одеського гросмейстера Юхима Геллера — свого часу офіційно визнаного найкращим спортсменом Одеси XX століття.","До гравців, які пройшли кваліфікаційний етап тижнем раніше, приєдналися спеціально запрошені учасники. Усього змагалися 56 шахістів.","Турнір проведено за підтримки VST банку; голова правління банку Вадим Мороховський — президент Федерації шахів Одеської області. Суддівська колегія працювала під керівництвом міжнародного арбітра Олександра Прохорова (Львів).","Партії десяти перших дошок кожного з одинадцяти турів транслювалися наживо.","## Відбірковий етап (22 листопада 2025)","В Об’єднанні ШШК пройшов півфінал Всеукраїнського шахового турніру пам’яті Юхима Петровича Геллера.","За результатами змагання 25 шахістів отримали право на участь у фіналі. Початок фіналу 29 листопада об 11:00. Реєстрація 10 -10.45"],

   "title": "Шість кваліфікаційних турнірів (жовтень — листопад 2025)",
   "lead": "У групі «А» на юнацький розряд переміг Олександр Дерменжі, у групі «Б» — Денізхан Озхан. Юнацький розряд виконали п’ятеро шахістів.",
   "body": ["З 18 жовтня по 1 листопада в Об’єднанні шахово-шашкових клубів Одеської області одночасно пройшли шість кваліфтурнірів: на юнацькій, третій, другий, перший розряди та рейтинговый турнир.","На юнацькій розряд змагання проводилися у двох групах «А» та «Б».","Група «А»:","1 місце — Дерменжі Олександр.","2 місце — Хачатрян Арсен.","3 місце — Оганесян Давид.","Группа «Б»:","1 місце — Озхан Денізхан.","2 місце — Бендус Юрий.","3 місце — Жаров Даніїл.","Юнацькій розряд виконали: Озхан Денізхан, Бендус Юрій, Дерменжі Олександр, Хачатрян Арсен, Оганесян Давид.","На третій розряд:","1 місце — Яцкар Кирило.","2 місце — Дулько Михайло.","3 місце — Хромов Михайло.","Третій розряд виконали: Яцкар Кирило та Дулько Михайло.","На другий розряд:","1 місце — Комаров Микита.","2 місце — Гулієв-Вертій Марк.","3 місце — Швец Марк.","Норму другого разряда виконав — Комаров Микита.","На перший розряд :","1 місце — Завезіон Герман.","2 місце — Самаричева Анастасія.","3 місце — Волканов Владислав.","Рейтинговий турнір:","1 місце — Борисов Лев.","2 місце — Саакян Арам.","3 місце — Донов Андрій.","Змагання проводилися за підтримки VST bank, голова правління Вадим Мороховський.","## Анонс змагань","З 18 жовтня по 01 листопада 2025 року Об’єднання шахово-шашкових клубів (вул. Канатна, 95) проводить кваліфікаційні турніри на перший юнацький, третій, другий, перший розряди та рейтинговий турнір.","Турові дні: 18, 19, 25, 26 жовтня та 01 листопада 2025 року.","Початок змагань о 10-00.","Реєстрація учасників – 18 жовтня о 10-00.","При собі мати кваліфікаційний квиток, який підтверджує діючий розряд."],

   "id": "n-2025-mazurov",

   "year": "2025",
   "title": "Анонс: пам’ятний турнір на честь молодшого сержанта Сергія Мазурова",
   "lead": "6 липня 2025 року в м. Південне — масовий турнір зі швидких шахів з обрахунком міжнародного рейтингу.",
   "body": ["Запрошуємо всіх бажаючих прийняти участь в пам’ятному шаховому турнірі, присвяченому вшануванню світлої пам’яті молодшого сержанта Мазурова Сергія Сергійовича — воїна 126-ї бригади ТрО (нині 39 окрема бригада берегової оборони), кавалера ордена «За мужність» III ступеня (посмертно).","Турнір масовий, буде розіграно дуже багато призів, як у дитячих вікових категоріях (до 8, до 10, до 12 та до 16 років), так у ветеранських категоріях (понад 50, понад 65 та понад 75 років), також серед жінок та дівчат. Турнір з обрахунком міжнародного рейтингу. Контроль часу -10 хвилин з додаванням 5 секунд за кожен хід.","Цей турнір проводиться, щоб зібрати побратимів, ветеранів, волонтерів та небайдужих громадян задля вшанування його подвигу, а також популяризації інтелектуального спорту серед ветеранів та молоді.","6 липня м. Південне. Точне місце проведення буде повідомлено зареєстрованим учасникам ближче до дати турніру.","Кількість учасників обмежена. Пріоритет тим, хто зареєструвався раніше.","Реєстрація учасників за телефоном +380 63 736 33 35 (Євген Володимирович), краще писати на вайбер."],

   "lead": "З 7 по 28 червня 2025 року — 84 юні шахісти; переможцями рейтингових турнірів стали Артем Шевченко та Лев Борисов.",
   "body": ["З 7 по 28 червня у шахово-шашковому клубі пройшов Областний дитячий турнір «Меморіал І.З. Постола.","У змаганнях взяли участь 84 юні шахісти.","За підсумками змагань були виконані наступні розряди:","юнацькій — Волков Лаврентій, Пипенко Анастасія, Гільов Михайло, Броска Даніїл, Дулько Михайло, Сільниченко Владислав, Дідинчук Артем, Ущаповський Тимур. Лупан Єгор,","Третій розряд — Єганян Давид, Чугаєвський Святозар.","Другий розряд — Вінгріс Артур.","Рейтинговий турнір 1:","1 місце — Шевченко Артем","2 місце — Поправка Богдан","3 місце — Стемберський Павло","Рейтинговый турнир 2:","1 місце — Борисов Лев","2 місце — Саакян Арам","3 місце — Поправка Богдан.","## Анонси змагань","З 7 по 28 червня 2025 року Об’єднання шахово-шашкових клубів проводить Обласний дитячий шаховий турнір «Меморіал І.З.Постола».","Кваліфікаційні турніри на перший юнацький, третій, другий, перший розряди та рейтинговий турнір.","При собі мати кваліфікаційний квиток, який підтверджує діючий розряд.","До участі допускаються гравці 2002 р.н. та молодше.","Змагання проводяться у два етапи:","І етап — з 7 по 21 червня 2025р. (ігрові дні: 7, 8, 14, 15, 21);","ІІ етап — з 24 по 28 червня 2025р. (ігрові дні: 24, 25, 26, 27, 28).","Контроль часу: 65 хвилин кожному учаснику до кінця партії.","Реєстрація І етапу – 7 червня з 10.00 по 10.30.","Переможці змагань усіх турнірів нагороджуються кубками, медалями та грамотами.","З 24 по 28 червня 2025 року Об’єднання шахово-шашкових клубів проводить Обласний дитячий шаховий турнір «Меморіал І.З.Постола» ІІ етап.","Кваліфікаційні турніри на перший юнацький, третій, другий, перший розряди та рейтинговий турнір.","При собі мати кваліфікаційний квиток, який підтверджує діючий розряд.","До участі допускаються гравці 2002 р.н. та молодше.","Змагання проводяться:","ІІ етап — з 24 по 28 червня 2025р.( ігрові дні:24, 25, 26, 27, 28)","Контроль часу: 65 хвилин кожному учаснику до кінця партії.","Реєстрація ІІ етапу – 24 червня з 10.00 по 10.30.","Переможці змагань усіх турнірів нагороджуються кубками, медалями та грамотами."],

   "lead": "З 22 лютого по 8 березня 2025 року — кваліфікаційні турніри на перший юнацький, третій, другий, перший розряди та рейтинговий турнір.",
   "body": ["8 березня 2025 року завершилися кваліфтурніри на юнацькій, третій, другий, та перший розряд.","За результатами змагань було виконано:","юнацький розряд — Григорій Леонід, Пісьменнов Михайло, Бачурський Олександр;","третій розряд — Кузьмій Володимир, Скачко Микола, Гончарук-Дружкова Єлизавета, Швець Марк;","другий розряд — Лоза Богдан;","перший розряд — Андреевич Андрій, Вискребенцев Федір, Волканова Софія.","## Анонс змагань","З 22 лютого по 8 березня 2025 року Об’єднання шахово-шашкових клубів (вул. Канатна, 95) проводить кваліфікаційні турніри на перший юнацький, третій, другий, перший розряди та рейтинговий турнір.","Турові дні: 22, 23 лютого та 1, 2, 8 березня.","Початок змагань о 10-00.","Реєстрація учасників та І тур 22 лютого о 10-00.","При собі мати кваліфікаційний квиток, який підтверджує діючий розряд."],

   "year": "2024",
   "title": "Різдвяні турніри 2024/2025",
   "lead": "З 25 грудня 2024 по 9 січня 2025 року — дитячі бліц і рапід, кваліфікаційні турніри на всі розряди, рапід і бліц для всіх бажаючих.",
   "body": ["За результатами різдвяних турнірів з 3 по 9 січня було виконано:","юнацький розряд","1. Кузьмій Володимир","2. Ніколаев Денис","3. Потапов Тимур","4. Лановий Микита.","Третій розряд","1. Лоза Анна","2. Роздайбіда Іван","3. Панасюк Ігор.","Другий розряд","1. Крамаренко Іван.","## Анонс змагань","Федерація шахів Одеської області, Об’єднання шахово-шашкових клубів та КДЮСШ з шахів та шашок (вул. Канатна,95) у термін з 25 грудня 2024р. по 9 січня 2025р. проводять наступні різдвяні турніри для дітей та дорослих:","— 25 грудня 2024р. бліц — турнір для дітей, реєстрація о 10-00;","— 26-27 грудня 2024р. – турнір для дітей з швидких шахів, реєстрація о 10-00 ;","— 3, 5, 7, 8, 9 січня 2025р. кваліфтурніри на усі розряди та рейтинговий турнір,реєстрація 3 січня 2025р. о 10-00,","Усі учасники дитячих турнірів отримують новорічні подарунки.","— 28,29 грудня 2024р. турнір з швидких шахів для усіх бажаючих, не нижче першого розряду, реєстрація: 28.12.2024р. з 10-00 до 10-45, початок першого туру 28.12.2024р. о 11.00.","— 4 січня 2025р. турнір з блискавичної гри для усіх бажаючих,не нижче першого розряду,реєстрація: 4.01.2025р.","з 10-00 до 10-45, початок першого туру 4.01.2025р. о 11.00.","Змагання проводяться при підтримці ПАТ Банку «Восток» (голова правління Мороховський В.В.)"],

   "body": ["З 3 по 19 жовтня в приміщені ОШШК пройшли кваліфтурніри на рейтинговий, перший, другий та третій розряди.","У рейтиговому турнірі перше місце виборов — Донов Андрій;","друге — Саакян Арам;","Третє — Страутман Альбін.","В турнірі на перший розряд переміг та виконав норму першого разряду — Демченков Владислав;","Друге місце виборов — Копенко Вадим;","Третє — Копенко Максим.","В турнірі на другий розряд переміг та виконав норму другого розряду — Орловський Вадим;","Друге місце — Голубева Аліна;","Третє — Алікян Ніколя.","В турнірі на третій розряд перемогла та виконала норму третьего розряду — Станчак Катерина;","Друге місце посів — Лоза Богдан;","Третє — Гулієв-Вертій Марк.","Вітаємо переможців та нагадуємо що наступні кваліфтурніри пройдуть у період шкільних канікул з 29 жовтня по 3 листопада 2024 року.","## Анонс змагань","З 5 по 19 жовтня 2024 року Об’єднання шахово-шашкових клубів (вул. Канатна, 95) проводить кваліфікаційні турніри на перший юнацький, третій, другий, перший розряди та рейтинговий турнір.","Турові дні: 5,6,12,13,19 жовтня.","Початок змагань о 10-00.","Реєстрація учасників та І тур 5 жовтня о 10-00.","При собі мати кваліфікаційний квиток, який підтверджує діючий розряд."],

   "lead": "Федерація шахів Одеської області вітає міжнародного гросмейстера, вихованця одеських шахів.",
   "body": ["Федерація шахів Одеської області щиро вітає вихованця одеських шахів: дворазового чемпіона Європи серед юнаків з класичної гри , чемпіона Європи з швидких шахів, бронзового призера чемпіонату Європи у складі збірної України з класичної гри, переможця та призера низки національних та міжнародних змагань міжнародного гросмейстера Дроздовського Юрія Анатолійовича з ювілеєм молодості 40-річчям від дня народження та бажають шановному ювіляру міцного здоров’я, щастя добра і добробуту, довголітнього служіння шаховому мистецтву."],

   "id": "n-2024-pershist-u8",
   "date": "2024-04-20",
   "dateNote": "",
   "year": "2024",
   "title": "Першість Одеської області з шахів серед хлопчиків та дівчаток до 8 років (2024)",
   "lead": "Чемпіоном серед хлопчиків з результатом 9 із 9 став Глеб Іваніченко, серед дівчаток — Анна Мельник.",
   "body": ["З 20 квітня по 4 травня Федерація та ОШШК провели першість Одеської області з шахів серед хлопчиків та дівчаток до 8 років.","Чемпіоном Одеської області серед хлопчиків з результатом 9 із 9 став Іваніченко Глеб.","Друге місце посів — Кірев Лука (Сарата).","Третє місце — Бойко Святослав.","Чемпіонкою області серед дівчаток стала — Мельник Анна.","Друге місце — Лавриненко Олена (Чорноморськ).","Паралельно з першістю області пройшли турніри на всі розряди. За підсумками змагань юнацький розряд виконали:","Кучеренко Владислав, Узун Ольга, Євсєгнєєв Іван, Тодосієнко Максим, Завадов Іван;","третій розряд: Катков Іван, Волканов Владислав;","другий розряд: Демченков Владислав, Годулян Георгій;","перший розряд: Тобак Северин, Лясоцький Олександр.","Змагання відбулися за підтримки ПАТ Банку «Восток «, голова правління Вадим Мороховський.","## Анонси змагань","З 20 квітня по 4 травня 2024 року Федерація шахів Одеської області та Об’єднання шахово-шашкових клубів (вулиця Канатна, 95) проводить Першість Одеської області з шахів (класична гра) серед юнаків та дівчат віком до 8 років (2016 р. н. та молодше) – відбірковий до Чемпіонату України, який відбудеться у м. Вінниці з 10 по 19 травня 2024 року.","Турові дні: 20,21,27,28 квітня та 4 травня.","Початок змагань о 10-00.","Реєстрація учасників та I тур 20 квітня о 10-00.","При собі мати кваліфікаційний квиток, який підтверджує діючий розряд.","З 20 квітня по 4 травня 2024 року Об’єднання шахово-шашкових клубів (вул. Канатна, 95) проводить кваліфікаційні турніри на перший юнацький, третій, другий, перший розряди та рейтинговий турнір.","Турові дні: 20,21,27,28 квітня та 4 травня.","Початок змагань о 10-00.","Реєстрація учасників та I тур 20 квітня о 10-00.","При собі мати кваліфікаційний квиток, який підтверджує діючий розряд."],

  {
   "id": "n-2024-champ-u14-u16",
   "date": "2024-03-26",
   "dateNote": "",
   "year": "2024",
   "title": "Чемпіонат Одеської області з шахів серед юнаків та дівчат до 14 і до 16 років",
   "lead": "Чемпіонами області до 14 років стали Лев Борисов і Дар’я Дроздова, до 16 років — Олександр Чепіль і Ніка Завезіон.",
   "body": ["З 26.02. по 06.03 в ОШШК проведено шість дитячих турнірів. Чемпіонати області серед юнаків та дівчат до 14 і 16 років, кваліфтурніри на юнацькі, третій, другий, перший розряди.","За підсумками змагань чемпіонами області до 14 років стали, серед юнаків Лев Борисов, серед дівчат Дар’я Дроздова.","Серед юнаків до 16 років, Чепіль Олександр. Серед дівчат до 16 років, Завезион Ніка.","Юнацькі розряди виконали:","Панімаш Даря","Коровін Тимур","Вальчук Анастасія","Ніколенко Анастасія","Фармагей Олександр","Чернега Андрій","Норму третього розряду виконали:","Годулян Георгій","Скачко Микола","Норму другого розряду виконали:","Самарічева Анастасія","Хмельовський Максим","Змагання пройшли за підтримки банку «Восток», голова правління Вадим Мороховський.","## Анонс змагань","Федерація шахів Одеської області та Об’єднання шахово-шашкових клубів Одеської області з 26 березня по 6 квітня 2024 року проводять Чемпіонат Одеської області з шахів (класична гра) серед юнаків та дівчат до 14 (2010/2011 р.н.) років та до 16 років (2008/2009 р.н.)","Турові дні: 26.03 – 1 тур, 27.03 – 2, 3 тури, 28.03 – 4, 5 тури, 29.03 – 6, 7 тури, 6.04 — 8, 9 тури та закриття змагань.","Реєстрація учасників та 1 тур 26 березня з 10.00 за адресою: вул. Канатна, 95","При собі мати кваліфікаційний квиток, який підтверджує діючий розряд."],

   "title": "Чемпіонат Одеської області з шахів (класична гра) — відбірковий до Чемпіонату України",
   "lead": "Чемпіоном Одеської області 2024 року став Максим Снігуров. Призовий фонд — 40 000 грн.",
   "body": ["Закінчившийся чемпіонат Одеської області по шахам 2024 року став надбанням історії","Не дивлячись на ворожі атаки, вимкнення світла, переноси турів, федерація шахів, учасники чемпіоната, судді,співробітники ОШШК і КДЮСШ, зробили все, щоб турнір відбувся.","За наслідками змагань чемпіоном 2024 року став — Максим Снігурів.","Кращий результат серед ветеранів 50 + показав Василь Стець, 65+ — Мойсей Хазанкін.","Перший жіночий приз виборола Ніка Завезіон.","Кращим серед юнаків став Артем Довгань.","Змагання відбулися завдяки підтримці банку «Восток» — голова правління — Вадим Мороховський.","## Анонс змагань","Федерація шахів Одеської області та Об’єднання шахово-шашкових клубів Одеської області з 9 по 31 березня 2024 року проводять Чемпіонат Одеської області з шахів (класична гра) — відбірковий до Чемпіонату України 2024 року.","Призовий фонд — 40 000 грн. Змагання проводяться за підтримки ПАТ «Восток» (голова Правління — Мороховський Вадим Вікторович).","Реєстрація учасників 9 березня з 10.00 до 10.45. Початок 1 туру об 11.00."],

   "body": ["Підведено підсумки чемпіонатів Одеської області з шахів серед юнаків та дівчат до 10-ти та 12 років.","Чемпіонами до 10 років стали:","Шихавцов Данило серед хлопчиков та Груздева Ніколь серед дівчаток.","Чемпіонами до 12 років стали:","серед юнаків — Бондаренко Артем, серед дівчат — Орленко Влада.","Вітаємо переможців та бажаємо удачі на чемпіонах України 2024 року.","## Анонс змагань","10 лютого (субота) з 10.00 починається Першість Одеської області з шахів (класична гра) серед юнаків та дівчат до 10 років (2014 р.н. та молодші) та до 12 років (2012 р.н. та молодші) — відбіркова до Чемпіонату України 2024 року.","Реєстрація учасників та 1 тур з 10.00 за адресою: м. Одеса, вул. Канатна, 95.","Змагання проводилися окремо у двох категоріях: ЧОО 10 (18 учасників) та ЧОО 12 (13 учасників)."],

   "title": "Пішов з життя Юрій Маркович Гордіан",
   "lead": "Відомий шаховий композитор, гросмейстер і міжнародний арбітр з шахової композиції (24.03.1937 — 08.01.2024).",
   "body": ["Федерація шахів Одеської області, ОШШК та КДЮСШ з глибоким сумом повідомляють, що на 87 році після тривалої тяжкої хвороби пішов з життя відомий шаховий композитор, заслужений майстер спорту, гросмейстер та міжнародний арбітр з шахової композиції, чотириразовий чемпіон світу з шахової композиції у складі команди СРСР та чемпіон світу у складі команди України, триразовий срібний призер чемпіонату світу у складі команди України, багаторазовий чемпіон та призер України з шахової композиції в особистому та командному заліку, переможець та призер численних національних та міжнародних конкурсів, головний редактор журналу «Проблеміст України», дитячий тренер ГОРДІАН Юрій Маркович (24.03.1937-08.01.2024) та висловлюють щире співчуття, його рідним, близьким та його учням."],

   "title": "Дитячі новорічні шахові свята",
   "lead": "З 3 по 5 січня 2024 року — бліц, сеанс одночасної гри, турнір зі швидких шахів і творчий конкурс. Участь безкоштовна.",
   "body": ["Федерація шахів Одеської області, Об’єднання шахово-шашкових клубів та КДЮСШ з шахів та шашок (м. Одеса, вул. Канатна, 95) за підтримки ПАТ Банку «Восток» (голова правління В. В. Мороховський) проводять дитячі новорічні свята.","У програмі: 3 січня — турнір з блискавичної гри у шахи та сеанс одночасної гри; 4–5 січня — турнір зі швидких шахів; 3–5 січня — конкурс на кращий малюнок, ліплення, реферат на шахову тематику.","Початок усіх заходів та реєстрація учасників змагань о 10.00.","Усі учасники заходів нагороджені новорічними подарунками. Участь у змаганнях безкоштовна.","## Як пройшов фестиваль","Новорічний шаховий фестиваль в ОШШК","Сеанси одначасної гри, конкурс малюнку, майстер-клас та бліц турніри, ось далеко не повна програма дитячого новорічного шахового фестивалю 2024 року.","Свято організували: федерація шахів Одеської області, ОШШК та КДЮСШ, за підтримки ПАТ банку Восток(голова правління Вадим Мороховський).","У рамках новорічного шахового фестивалю в ОШШК проведено ще два змагання. 4 і 5 січня — дитячий турнір зі швидких шахів, та 6 січня бліц для всіх бажаючих.","Нагадуемо, що з 13 по 14 січня, для шахістів не нижче першого разряду, пройде опен турнир з швидких шахів. Реєстрація 13.01 з 10.00 до 10.45.","Змагання проводяться за підтримки ПАТ Банку «Восток» (Голова правління Вадим Мороховський)."],

   "body": ["З 17 листопада по 4 грудня 2023 року проведено півфінал чемпіонату Одеської області з шахів серед юнаків та дівчат до 18 і 20 років з обрахуванням національного та міжнародного рейтингів.","До участі допускалися гравці 2004 р.н. та молодші з діючим першим розрядом або рейтингом ФШУ 1801 і вище.","Реєстрація — 17 листопада з 15.00 до 15.45. Турові дні: п’ятниця, субота, неділя. Початок: п’ятниця — 16.00, субота і неділя — 10.00.","Вступний внесок у вигляді добровільних пожертвувань — 400 грн; гравці, які не мають міжнародного рейтингу, — додатково 150 грн.","Три переможці отримують право участі у турнірі з нормою КМС.","## Старт чемпіонату","Сьогодні розпочався шаховий Чемпіонат серед юніорів віком до 18, 20 років."],

   "lead": "З 21 по 26 жовтня 2023 року — п’ять кваліфтурнірів; рейтинговий турнір виграла Ніка Завезіон.",
   "body": ["Підсумки турнірів","З 21 по 26 жовтня в Об’єднанні шахово-шашкових клубів було проведено п’ять кваліфтурнірів. За підсумками турнірів виконали:","Юнацький розряд: Ершов Максим, Ермаков Іван, Радов Ілля, Пишалко Назар, Чугуїв Андрій, Волков Георгій, Кузьміна Екатерина, Бойко Святослав.","• Третій розряд: Вербіцький Дмитро, Іваніченко Глеб.","• Другий розряд: Грудінін Владислав, Вискребенцев Федір.","• Перший розряд: Стемберський Павло, Завезіон Герман,Заверняев Микола.","Рейтинговый турнир, підсумки:","• Завезион Ніка.","• Руденко Вадим.","• Бредихін Данііл.","## Анонс змагань","Шановні учні та батьки! 21 жовтня (субота) заплановано проведення кваліфікаційних турнірів з шахів на усі розряди та рейтинговий турнір.","Реєстрація учасників та перший тур — о 10.00. Головний суддя — Тримбашевський Ігор Йосифович.","Турові дні: 21, 22, 24, 25 та 26 жовтня. Початок турів о 10.00."],

   "id": "n-2023-geller",
   "date": "2023-08-21",

   "year": "2023",
   "title": "Меморіал Юхима Геллера з шахів",
   "lead": "Коловий турнір з нормою КМС виграв Данило Агнянников; друге місце — Віктор Довженко, третє й норма КМС — Михайло Ойберман.",
   "body": ["Сьогодні, в останній день літа, закінчилися головні змагання меморіалу Ю.П.Геллера — круговий турнір з нормою кмс.","Перше місце виборов Данило Агнянников","Друге — Віктор Довженко","Третє місце і норму кмс — Михайло Ойберман","Підбиті підсумки кваліфтурнірів. За результатами змагань виконали:","Юнацький розряд:","Волканов Владислав, Донченко Платон, Шикиринський Мирон.","Третій розряд:","Козаченко Олексій, Кондратьєв Владислав, Крамаренко Іван, Ткаченко Володимир.","Другий розряд:","Волканов Єгор, Волканова Софія, Ніколенко Катерина.","Перший розряд:","Антоненко Дмитро, Бондаренко Артем, Орленко Влада.","Змагання відбулися за фінансового сприяння банку «Восток», голова правління Вадим Мороховський.","## Заключний етап дитячого турніру","Заключний етап дитячого шахового турніру «Меморіал Юхима Геллера»","З 23 до 31 серпня на Канатної, 95, для усіх бажаючих, буде проводитися заключний етап дитячого шахового турніру «Меморіал Юхима Геллера» на усі розряди та рейтинговий.","Реєстрація учасників та 1-й тур 23 серпня (середа) с 10.00.","Розклад змагань:","24.08 — 2,3 тури;","25.08 — 4,5 тури;","26.08 — 6,7 тури;","27.08 — 8,9 тури та закриття змагань.","Головний суддя Тримбашевський І.Й.","## Про турнір","Меморіал Юхима Геллера з шахів проходив з 21 по 31 серпня 2023 року за коловою системою: дванадцять учасників, шість дошок у кожному турі.","Норма КМС — 7 очок. Головний суддя, міжнародний арбітр — В. Ф. Богданов."],

  {
   "id": "n-2022-composition",
   "date": "2022-02-16",
   "dateNote": "",
   "year": "2022",
   "title": "Регламент відкритого чемпіонату Одеської області 2022 року з розв’язування шахових композицій",
   "lead": "20 лютого 2022 року на вул. Канатній, 95 — три тури: етюди, задачі на мат у три й у два ходи.",
   "body": ["Місце та термін проведення:","Чемпіонат буде проведено 20 лютого 2022 року в приміщенні","Одеського шахово-шашкового клубу за адресою: м. Одеса, вул. Канатна, 95 (на розі вул. Семінарської).","Початок чемпіонату о 10.00.","Організатори чемпіонату:","Федерація шахів Одеської області, Об’єднання шахово-шашкових клубів Одеської області.","Суддівська колегія:","Головний суддя: заслужений майстер спорту України – Сергій","Ткаченко.","Учасники чемпіонату:","До участі будуть допущені усі бажаючі з розрядом не нижче першого.","Турнірний внесок – 200 грн.","Реєстрація учасників: 20 лютого, з 9.00 до 9.45.","Правила проведення чемпіонату:","Змагання будуть проведені в три тури. Перерва між турами – 10 хвилин.","Всі завдання необхідно вирішити безпосередньо з діаграми!","У першому турі учасникам буде запропоновано вирішити за 50 хвилин чотири етюди.","У другому турі – за тридцять хвилин чотири задачі на мат у три хода.","У третьому турі – за двадцять хвилин шість задач на мат у два хода.","За правильне та повне рішення кожної композиції учаснику нараховується 5 балів. Неправильне рішення балів не дає. Переможці визначаються за більшою кількістю набраних балів. У випадку однакової кількості балів більш високе місце посяде учасник, який витратив на рішення менше часу.","Змагання проводяться з дотриманням санітарних і протиепідемічних вимог відповідного етапу карантину, виконанням протоколів МОЗ України для проведення спортивних заходів та рекомендацій європейського шахового союзу.","Нагородження переможців:","Учасники, які посядуть 1–3 місця, будуть нагороджені кубком, медалями, дипломами та книгами з шахів."],

   "year": "2022",
   "title": "Чемпіонат Одеської області з бліцу та рапіду 2022: регламенти й перенесення",
   "lead": "Чемпіонат планували на 4–6 лютого 2022 року; через епідеміологічну ситуацію його перенесли на 12–14 березня.",
   "body": ["## Перенесення (4 лютого 2022 року)","У зв’язку з несприятливою епідеміологічною ситуацією в Одесі та області чемпіонат з бліцу та рапіду переноситься. Про нові терміни проведення буде повідомлено додатково.","## Регламент від 17 лютого 2022 року (нові дати: 12–14 березня)","1. Мета і завдання","Змагання проводяться в цілях:","а) відбору спортсменів для участі в чемпіонаті України 2022 р.;","б) популярізації шахів серед населення;","в) підвищення рівня майстерності спортсменів.","2. Термін та місце проведення","Змагання з проводяться з 12 до 14 березня 2022 року за адресою:м. Одеса, вул. Канатна, 95.","3. Організація та керівництво проведенням змагань","3агальне керівництво проведенням змагань здійснюють: управління фізичної культури і спорту Одеської обласної державної адміністрації, федерація шахів Одеської області, Об`єднан- ня шахово-шашкових клубів Одеської області.","Відповідальність за підготовку та безпосереднє проведення змагань покладається на суддівську колегію, рекомендовану обласною федерацією.","4. Учасники змагань","До участі у турнірі допускаються шахісти, які мають спортивну кваліфікацію «1 спортивний розряд» та вище.","Для допуску до змагань всі учасники повинні надати організаторам копію документа, що підтверджує негативний результат тестування на COVID-19 методом полімеразної ланцюгової реакції або експрес-тесту на визначення антигена короновірусу SARS-CoV-2, яке проведене не більш як за 72 години до початку змагань або копію документа, що підтверджує отримання повного курсу вакцинації, міжнародного, внутрішнього сертифіката або іноземного сертифіката, що підтверджує вакцинацію від COVID-19 однією дозою однодозної вакцини або двома дозами дводозної вакцини (зелені сертифікати).","5. Характер заходу","Змагання проводяться відповідно до Правил спортивних змагань з шахів за швейцарською системою у 9 турів. Змагання проводяться з обрахуванням міжнародного та національного рейтингів.","Бліц:","Контроль часу 3 хвилини кожному учаснику з додаванням 2 секунд після зробленого ходу, починаючи з першого;","Турові дні: 14.03. Початок турів -16.00. Реєстрація – 14.03.2022 з 14:00 до 15:45.","Рапід:","Контроль часу 10 хвилини кожному учаснику з додаванням 5 секунд після зробленого ходу, починаючи з першого;","Дні: 12–13.03, початок — 16.00, реєстрація 12.03 з 14.00 до 15.45","6. Безпека та підготовка місць проведення змагань","Підготовка місць проведення змагань здійснюється відповідно до постанови Кабінету Міністрів України від 18 грудня 1998 року № 2025 «Про порядок підготовки спортивних споруд","Та інших спеціально відведених місць для проведення масових спортивних та культурно-видовищних заходів» та від 09 грудня 2020 року № 1236 «Про встановлення карантину та запровадження посилених протиепідемічних заходів та території із значним поширенням гострої респіраторної хвороби COVID-19,спричиненої короно вірусом SARS-CoV-2 Постанови Головного санітарного лікаря України від 19.11.2020 № 58 «Про затвердження протиепідемічних заходів під час проведення спортивних змагань на період карантину у з`вязку з поширенням короновірусної хвороби (COVID-19)».","7. Умови визначення та нагородження переможців","Переможці виявляються за найбільшою кількістю набраних очок. У випадку рівності очок усі місця виявляються за слідуючими критеріями та в наступному порядку:","1. – повний коефіцієнт Бухгольца ;","2.– медиальний коефіцієнт Бухгольца;","3. – коефіцієнт прогреса;","— вступний внесок у вигляді добровільних пожертвувань – бліц – 100 грн., рапід – 150 грн.","— знижка для ветеранів(1972р.н. та старші) та юнаків(2003 р. н. та молодші) – 50 грн.","— Призовий фонд змагань: призові учасникам:","Бліц:","Основний залік: 1-е місце — 2000 грн. 4-е місце — 800 грн.","2-е місце — 1200 грн. 5-е місце — 600 грн.","3-є місце — 1000 грн.","По категоріям – 4х (400+200) грн. Усього=8000 грн.","4 категорії: ветерани 65+(1957 р.н. та старші),ветерани 50+ (1972 р.н. та старші),жінки, юнаки(2003 р.н. та молодші)","Рапід:","Основний залік: 1-е місце — 3000 грн. 4-е місце — 1000 грн.","2-е місце — 2000 грн. 5-е місце — 800 грн.","3-є місце — 1200 грн.","По категоріям – 4х (600+400) грн. Усього=12000 грн.","4 категорії: ветерани 65+(1957 р.н. та старші),ветерани 50+ (1972 р.н. та старші),жінки, юнаки(2003 р.н. та молодші)","Призи по категоріям встановлюються:","1-3 учасники в категорії без призів","4-7 учасників в категорії 1 приз 600 грн.","8 і більше учасників в категорії 2 призи 600 та 400 грн.","Призи видаються при наданні копії паспорта та ІК та обкладаються податком 19,5 %","3.5. Переможець турніру оголошується чемпіоном Одеської області та отримує право участі у чемпіонаті України 2021 року.","8.Умови фінансування заходу та матеріального забезпечення учасників","Всі витрати на організацію та проведення змагань (нагородна атрибутика, дезінфекційні засоби (антисептик) та інше несуть організатори турніру.","Всі витрати з участі спортсменів та тренерів у змаганні: оплата проїзду та добових, харчування та проживання несуть організації, що відряджають.","Цей регламент є офіційним викликом на змагання.","## Регламент від 26 січня 2022 року (первинні дати: 4–6 лютого)","1. Мета і завдання","Змагання проводяться в цілях:","а) відбору спортсменів для участі в чемпіонаті України 2022 р.;","б) популярізації шахів серед населення;","в) підвищення рівня майстерності спортсменів.","2. Термін та місце проведення","Змагання з проводяться з 04 до 06 лютого 2022 року за адресою: м. Одеса, вул. Канатна, 95. У разі зміни рівня карантинних обмежень змагання можуть бути перенесені на інший термін.","3. Організація та керівництво проведенням змагань","3агальне керівництво проведенням змагань здійснюють: управління фізичної культури і спорту Одеської обласної державної адміністрації, федерація шахів Одеської області, Об`єднання шахово-шашкових клубів Одеської області.","Відповідальність за підготовку та безпосереднє проведення змагань покладається на суддівську колегію, рекомендовану обласною федерацією.","4. Учасники змагань","До участі в турнірі допускаються шахісти, які мають спортивну кваліфікацію","«Перший спортивний розряд» та вище.","Для допуску до змагань всі учасники повинні надати організаторам копію документа, що підтверджує негативний результат тестування на COVID-19 методом полімеразної ланцюгової реакції або експрес-тесту на визначення антигена короновірусу SARS-CoV-2, яке проведене не більш як за 72 години до початку змагань або копію документа, що підтверджує отримання повного курсу вакцинації, міжнародного, внутрішнього сертифіката або іноземного сертифіката, що підтверджує вакцинацію від COVID-19 однією дозою однодозної вакцини або двома дозами дводозної вакцини (зелені сертифікати).","5. Характер заходу","Змагання проводяться відповідно до Правил спортивних змагань з шахів за швейцарською системою в 9 турів. Змагання проводяться з обрахуванням міжнародного та національного рейтингів.","Бліц: Контроль часу 3 хвилини кожному учаснику з додаванням 2 секунд після зробленого ходу, починаючи з першого;","Турові дні: 04.02. Початок турів – 16.00. Реєстрація – 04.02.2022 з 14:00 до 15:45.","Рапід: Контроль часу 10 хвилини кожному учаснику з додаванням 5 секунд після зробленого ходу, починаючи з першого.","Дати турів: 05–06.02, початок — 16.00, реєстрація 05.02 з 14.00 до 15.45","Безпека та підготовка місць проведення змагань","Підготовка місць проведення змагань здійснюється відповідно до постанови Кабінету Міністрів України від 18 грудня 1998 року № 2025 «Про порядок підготовки спортивних споруд","Та інших спеціально відведених місць для проведення масових спортивних та культурно-видовищних заходів» та від 09 грудня 2020 року № 1236 «Про встановлення карантину та запровадження посилених протиепідемічних заходів та території із значним поширенням гострої респіраторної хвороби COVID-19,спричиненої короно вірусом SARS-CoV-2 Постанови Головного санітарного лікаря України від 19.11.2020 № 58 «Про затвердження протиепідемічних заходів під час проведення спортивних змагань на період карантину у з`вязку з поширенням короновірусної хвороби (COVID-19)».","7. Умови визначення та нагородження переможців","Переможці виявляються за найбільшою кількістю набраних очок. У випадку рівності очок усі місця виявляються за слідуючими критеріями та в наступному порядку:","1. – повний коефіцієнт Бухгольца ;","2.– медіальний коефіцієнт Бухгольца;","3. – коефіцієнт прогреса;","— вступний внесок у вигляді добровільних пожертвувань – бліц – 150 грн., рапід – 200 грн.","— знижка для ветеранів (1972 р.н. та старші) та юнаків (2003 р. н. та молодші) – 50 грн.","— Призовий фонд змагань: призові учасникам:","Бліц:","Основний залік: 1-е місце — 2000 грн. 4-е місце — 800 грн.","2-е місце — 1200 грн. 5-е місце — 600 грн.","3-є місце — 1000 грн.","За категоріями – 4х (400+200) грн. Усього=8000 грн.","Чотири категорії: ветерани 65+(1957 р.н. та старші);ветерани 50+ (1972 р.н. та старші); жінки; юнаки (2003 р.н. та молодші)","Рапід:","Основний залік: 1-е місце — 3000 грн. 4-е місце — 1000 грн.","2-е місце — 2000 грн. 5-е місце — 800 грн.","3-є місце — 1200 грн.","За категоріями – 4х (600+400) грн. Усього = 12000 грн.","Чотири категорії: ветерани 65+ (1957 р.н. та старші); ветерани 50+ (1972 р.н. та старші); жінки; юнаки (2003 р.н. та молодші)","Призи за категоріями встановлюються:","1-3 учасники в категорії без призів","4-7 учасників в категорії 1 приз 600 грн.","8 і більше учасників в категорії 2 призи 600 та 400 грн.","Призи видаються при наданні копії паспорта та ІК та обкладаються податком 19,5 %.","3.5. Переможець турніру оголошується чемпіоном Одеської області та отримує право участі в чемпіонаті України 2021 року.","Умови фінансування заходу та матеріального забезпечення учасників","Всі витрати на організацію та проведення змагань (нагородна атрибутика, дезінфекційні засоби (антисептик) та інше несуть організатори турніру.","Всі витрати з участі спортсменів та тренерів у змаганні: оплата проїзду та добових, харчування та проживання несуть організації, що відряджають.
