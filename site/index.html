   "lead": "Перше місце — Олексій Молчанов (7 очок з 9, за додатковими показниками), друге — Михайло Тобак, третє — Олексій Кукелко.",
   "body": ["Чемпіонат проходив з 15 по 30 січня 2022 року за адресою: м. Одеса, вул. Канатна, 95, за швейцарською системою у 9 турів. Підсумкову таблицю опубліковано 29 січня 2022 року.","## Регламент проведення чемпіонату Одеської області з шахів 2022 року (класична гра)","1. Мета і завдання","Змагання проводяться в цілях:","а) відбору спортсменів для участі в чемпіонаті України 2022 р.;","б) популярізації шахів серед населення;","в) підвищення рівня майстерності спортсменів.","2.Термін та місце проведення","Змагання з проводяться з 15 до 30 січня 2022 року за адресою:м. Одеса, вул. Канатна, 95.","3. Організація та керівництво проведенням змагань","3агальне керівництво проведенням змагань здійснюють: управління фізичної культури і спорту Одеської обласної державної адміністрації, федерація шахів Одеської області, Об`єднан- ня шахово-шашкових клубів Одеської області.","Відповідальність за підготовку та безпосереднє проведення змагань покладається на суддівську колегію, рекомендовану обласною федерацією.","4. Учасники змагань","До участі у турнірі допускаються шахісти, які мають спортивну кваліфікацію","«1 спортивний розряд» та вище.","Для допуску до змагань всі учасники повинні надати організаторам копію документа, що підтверджує негативний результат тестування на COVID-19 методом полімеразної ланцюгової реакції або експрес-тесту на визначення антигена короновірусу SARS-CoV-2, яке проведене не більш як за 72 години до початку змагань або копію документа, що підтверджує отримання повного курсу вакцинації, міжнародного, внутрішнього сертифіката або іноземного сертифіката, що підтверджує вакцинацію від COVID-19 однією дозою однодозної вакцини або двома дозами дводозної вакцини (зелені сертифікати).","5.Характер заходу","Змагання проводяться відповідно до Правил спортивних змагань з шахів за швейцарською системою у 9 турів. Змагання проводяться з обрахуванням міжнародного та національного рейтингів.","Контроль часу 90 хвилин кожному учаснику з додаванням 30 секунд після зробленого ходу, починаючи з першого; Турові дні: 15-17.01, 22-24.01, 28-30.01. Початок турів -16.00 Запізнення: 60 — хвилин. Реєстрація – 15.01.2022 з 14:00 до 15:45.","У перших 6 турах допускається двічі взяти нічию без гри, повідомивши суддівську колегію до початку жеребкування.","6. Безпека та підготовка місць проведення змагань","Підготовка місць проведення змагань здійснюється відповідно до постанови Кабінету Міністрів України від 18 грудня 1998 року № 2025 «Про порядок підготовки спортивних споруд","Та інших спеціально відведених місць для проведення масових спортивних та культурно-видовищних заходів» та від 09 грудня 2020 року № 1236 «Про встановлення карантину та запровадження посилених протиепідемічних заходів та території із значним поширенням гострої респіраторної хвороби COVID-19,спричиненої короно вірусом SARS-CoV-2 Постанови Головного санітарного лікаря України від 19.11.2020 № 58 «Про затвердження протиепідемічних заходів під час проведення спортивних змагань на період карантину у з`вязку з поширенням короновірусної хвороби (COVID-19)».","7. Умови визначення та нагородження переможців","Переможці виявляються за найбільшою кількістю набраних очок. У випадку рівності очок усі місця виявляються за слідуючими критеріями та в наступному порядку:","1. – повний коефіцієнт Бухгольца ;","2.– медиальний коефіцієнт Бухгольца;","3. – коефіцієнт прогреса;","— вступний внесок у вигляді добровільних пожертвувань – 300 грн.","— знижка для ветеранів(1972р.н. та старші) та юнаків(2003 р. н. та молодші) – 100 грн. Учасники без рейтингу FIDE додатково сплачують 150 грн. для обрахування рейтингу.","— Призовий фонд змагань: призові учасникам:","Основний залік: 1-е місце — 4000 грн. 4-е місце — 1000 грн.","2-е місце — 3000 грн. 5-е місце — 1000 грн.","3-є місце — 2000 грн.","По категоріям – 4х (600+400) грн. Усього=15000 грн.","4 категорії: ветерани 65+(1957 р.н. та старші),ветерани 50+ (1972 р.н. та старші),жінки, юнаки(2003 р.н. та молодші)","Призи по категоріям встановлюються:","1-3 учасники в категорії без призів","4-7 учасників в категорії 1 приз 600 грн.","8 і більше учасників в категорії 2 призи 600 та 400 грн.","Призи видаються при наданні копії паспорта та ІК та обкладаються податком 19,5 %","3.5. Переможець турніру оголошується чемпіоном Одеської області та отримує право участі у чемпіонаті України 2021 року.","8.Умови фінансування заходу та матеріального забезпечення учасників","Всі витрати на організацію та проведення змагань (нагородна атрибутика, дезінфекційні засоби (антисептик) та інше несуть організатори турніру.","Всі витрати з участі спортсменів та тренерів у змаганні: оплата проїзду та добових, харчування та проживання несуть організації, що відряджають.","Цей регламент є офіційним викликом на змагання."],

   "body": ["## Положення про проведення чемпіонату КДЮСШ та Одеської області з шахів 2021 року до 16, 18 і 20 років","1. Мета і завдання:","— визначення найсильніших шахістів і учасників першості України;","— підвищення спортивної майстерності та можливість виконання кваліфікаційних норм;","— пропаганда шахів.","2. Час і місце проведення:","Чемпіонат проводиться з 20 по 30 листопада 2021 року:","— за кількості учасників до 12: за коловою системою в 9–11 турів; ігрові дні 20–28.11 (за 11 турів — ще 29 і 30.11);","— за кількості учасників 13 і більше — за швейцарською системою в 9 турів; ігрові дні 20–28.11.","Реєстрація 20 листопада з 15.00 до 15.45; початок турів — 16.00.","Чемпіонат проводиться з обрахуванням міжнародного та національного коефіцієнтів, з дотриманням усіх чинних карантинних обмежень. У разі посилення карантину на вказаний період чемпіонат може бути відкладено.","3. Контроль часу: 90 хвилин на партію кожному учаснику з додаванням 30 секунд після кожного ходу, починаючи з першого. Допустиме запізнення — 60 хвилин.","4. Учасники: до участі запрошуються КМС і першорозрядники з національним коефіцієнтом 2000 і вище, 2002 року народження та молодші.","Вступний внесок у вигляді добровільних пожертвувань для першорозрядників — 300 грн, для КМС — 50 грн (за обрахунок міжнародного рейтингу).","5. Визначення переможців: до 20 років — 2002 р.н. та молодші; до 18 років — 2004 р.н. та молодші; до 16 років — 2006 р.н. та молодші.","Переможці визначаються за найбільшою кількістю набраних очок, за рівності очок — за такими показниками: для швейцарської системи — Бухгольц, усереднений Бухгольц, прогрес; для колової системи — Бергер, кількість перемог, результати особистих зустрічей.","Переможці отримують право участі в чемпіонатах України у відповідних вікових групах.","Для переможців банк «Восток» встановив призовий фонд: 1 місце — 3 000 грн, 2 місце — 2 000 грн, 3 місце — 1 000 грн. Призи видаються за наявності копій паспортів (свідоцтв про народження) та ідентифікаційних кодів, утримується податок 19,5%.","## Пари 9 туру (опубліковано 26.11.2021)","Без пари: Hryhorenko, Oleksandr — зараховано поразку; Kukelko, Alexey — зараховано перемогу."],

   "lead": "З 16 по 20 серпня 2021 року на вул. Канатній, 95 — турніри А, В і С за швейцарською системою.",
   "body": ["З 16 по 20 серпня 2021 року на вул. Канатній, 95 проводиться дитячо-юнацький турнір у рамках «Меморіалу Юхима Геллера».","Офіційна реєстрація — 15 серпня з 11.00 до 14.00 на вул. Канатній, 95.","Турнір А — до 12 років, 2009 р.н. та молодші. Швейцарська система, 9 турів. Контроль часу — 65 хвилин кожному учаснику до кінця партії. Допускаються учасники з першим і другим розрядами. Початок турніру — о 10.00, другий тур — о 12.30.","Турнір В — до 18 років, 2003 р.н. та молодші. Швейцарська система, 9 турів. Контроль часу — 65 хвилин кожному учаснику до кінця партії. Допускаються учасники з розрядом не нижче третього. Початок турніру — о 10.00, другий тур — о 12.30.","Турнір С — до 12 років, 2009 р.н. та молодші. Швейцарська система, 10 турів (по дві партії на день зі зміною кольору). Контроль часу — 65 хвилин кожному учаснику до кінця партії. Допускаються учасники з розрядом не нижче першого юнацького. Початок турніру — о 10.00, другий тур — одразу після закінчення першого.","Під час гри стороннім заборонено перебувати в приміщеннях КДЮСШ, де проходять змагання. Дотримання масочного режиму та інших протиепідемічних заходів — обов’язкова умова.","У турнірах А і В обраховуватиметься національний рейтинг. В усіх турнірах можливе виконання норм розрядів."],

   "title": "Положення про турнір, присвячений Міжнародному дню шахів (2021)",
   "lead": "20 липня 2021 року — швидкісне розв’язування етюдів і бліц-турнір для шахістів не нижче I розряду.",
   "body": ["Місце і час проведення: 20 липня в приміщенні Одеського шахово-шашкового клубу за адресою: вулиця Канатна, 95 (ріг вулиці Семінарської). Початок — 11.00. Реєстрація учасників — 10.15–10.45.","Організатори: Об’єднання шахово-шашкових клубів Одеської області за підтримки «Банку Восток».","Учасники: до участі допускаються шахісти не нижче I розряду без обмеження віку та без сплати благодійного внеску.","Порядок проведення: 1. Швидкісне розв’язування коротких етюдів. 2. Бліц-турнір.","## 1. Швидкісне розв’язування коротких етюдів","Після жеребкування учасники розбиваються на пари і за олімпійською системою визначають переможця.","На екрані проєктора демонструється позиція етюду, на розв’язування якого відводиться 180 секунд (3 хвилини). Учасник, у якого готова відповідь, натискає на світловий пульт і після дозволу судді називає розв’язок. Правильна відповідь оцінюється одним балом. За неправильної відповіді бал отримує суперник.","Якщо за 180 секунд ніхто з учасників не натисне на світловий пульт, то учасник, який за жеребкуванням отримав нижче місце, має дати обов’язкову відповідь. Далі правило «обов’язкової відповіді» переходить до його суперника і т. д.","В 1/8 фіналу рахунок іде до 2 очок одного з учасників. На наступних етапах — до 3 очок одного з учасників. У фіналі та матчі за 3-тє місце поєдинок триває до 4 очок.","У разі великої кількості зареєстрованих шахістів передбачено відбірковий тур.","## 2. Бліц-турнір","Швейцарська система, 9 турів. Контроль часу: 3 хвилини на партію кожному учаснику з додаванням 2 секунд після зробленого ходу, починаючи з першого.","Переможці визначаються за найбільшою сумою набраних очок. За рівності очок черговість додаткових показників: повний коефіцієнт Бухгольца, медіанний коефіцієнт Бухгольца та коефіцієнт прогресу.","Переможець і призери визначаються за найменшою сумою місць двох турнірів."],

   "id": "n-2021-cup-constitution",

   "title": "Положення про Кубок ОШШК, присвячений Дню Конституції (2021)",
   "lead": "29 і 30 червня 2021 року — швидкісне розв’язування задач і етюдів та рапід-турнір для юнаків і дівчат.",
   "body": ["Місце і час проведення Кубка: 29 і 30 червня в приміщенні Одеського шахово-шашкового клубу за адресою: вулиця Канатна, 95 (ріг вулиці Семінарської). Початок кожного етапу — 11.00. Початок реєстрації учасників — 29 червня з 10.00 до 10.45.","Організатори Кубка: Об’єднання шахово-шашкових клубів Одеської області за підтримки «Банку Восток».","Учасники Кубка: до участі допускаються юнаки та дівчата 2005 року народження включно і молодші, не нижче 1-го розряду.","Вступний внесок у вигляді добровільних пожертвувань: 300 гривень (2 етапи).","Правила проведення Кубка: змагання пройде у два етапи. 1-й етап (29 червня): швидкісне розв’язування задач і етюдів; 2-й етап (30 червня): рапід-турнір. Переможець і призери Кубка визначаються за сумою місць, посідених учасником у двох етапах.","## Регламент 1 етапу","У відбірковому турі на екрані проєктора послідовно буде показано 20 задач на мат у 2 ходи. Час на розв’язування кожної задачі — 1 хвилина.","За правильний розв’язок кожної задачі нараховується 2 бали. Неправильний розв’язок штрафується: мінус один бал. Прочерк (без розв’язку): 0 балів.","Переможці визначаються за найбільшою сумою балів. У фінал виходять 8 найкращих шахістів. За рівності балів вище місце посідає учасник, який написав більше правильних відповідей. У разі рівності балів порядок місць у фіналі визначається жеребом.","Склад пар і порядок виступу у фіналі визначаються відповідно до місць у відбірковому турі: 1–8; 2–7; 3–6 і 4–5.","У фінальному турі на екрані проєктора буде показано позицію етюду, на розв’язування якого відводиться 120 секунд (2 хвилини). Учасник, у якого готова відповідь, натискає на світловий пульт і після дозволу судді називає розв’язок. Правильна відповідь оцінюється одним балом. За неправильної відповіді бал отримує суперник.","Якщо за 120 секунд ніхто з шахістів не натисне на світловий пульт, то учасник, який посів нижче місце у відбірковому турі, має дати обов’язкову відповідь. Далі правило «обов’язкової відповіді» переходить до його суперника і т. д.","Переможцем у парі стає шахіст, який першим набрав 3 бали. У матчі за 1-ше місце поєдинок триває до 4 балів. Порядок місць з 3-го по 8-ме визначається з урахуванням місць, посідених у відбірковому турі.","## Регламент 2 етапу (рапід-турнір)","Швейцарська система, 9 турів. Контроль часу: 10 хвилин на партію кожному учаснику з додаванням 5 секунд після зробленого ходу, починаючи з першого.","Переможці визначаються за найбільшою сумою набраних очок. За рівності очок черговість додаткових показників: повний коефіцієнт Бухгольца, медіанний коефіцієнт Бухгольца та коефіцієнт прогресу.","Нагородження: буде оголошено додатково."],

   "lead": "Перше місце — Олександр Юровських (8 очок з 9, за додатковими показниками), друге — Олексій Молчанов, третє — Олексій Кукелко.",
   "body": ["Чемпіонат проходив 22–23 травня 2021 року в приміщенні КДЮСШ (вул. Канатна, 95) за швейцарською системою в 9 турів з обрахунком міжнародних рейтингів.","## Положення про проведення чемпіонату Одеської області з шахів 2021 року — бліц, рапід","Чемпіонат проводиться з метою підвищення спортивної майстерності одеських шахістів і для визначення переможців — учасників чемпіонату України.","Чемпіонат проводиться в приміщенні КДЮСШ (Канатна, 95): бліц — 15.05; рапід — 22, 23.05 за швейцарською системою в 9 турів з обрахунком міжнародних рейтингів. У разі посилення карантинних вимог чемпіонат може бути перенесено.","Контроль часу: бліц — 3 хвилини на партію кожному учаснику з додаванням 2 секунд після зробленого ходу, починаючи з першого; рапід — 10 хвилин на партію кожному учаснику з додаванням 5 секунд після зробленого ходу, починаючи з першого.","Початок 1-го туру — 16.00. Реєстрація: бліц — 15.05 з 14.00 до 15.45; рапід — 22.05 з 14.00 до 15.45.","Вступний внесок у вигляді добровільних пожертвувань: бліц — 100 грн, рапід — 150 грн. Знижка для ветеранів (1971 р.н. і старших) та юнаків (2002 р.н. і молодших) — 50 грн.","Переможці визначаються за найбільшою сумою набраних очок. За рівності — черговість додаткових показників: повний коефіцієнт Бухгольца; медіанний коефіцієнт Бухгольца; коефіцієнт прогресу.","Призовий фонд: бліц — 2 000, 1 200, 800, 600, 400 грн; за категоріями: 4 × (300 + 200) грн; усього 7 000 грн. Рапід — 2 500, 1 800, 1 200, 800, 600 грн; за категоріями: 4 × (400 + 300) грн; усього 9 700 грн.","Категорії: ветерани 65+ (1956 р.н. і старші); ветерани 50+ (1971 р.н. і старші); жінки; юнаки (2002 р.н. і молодші). За кількості учасників у категорії: 0–3 — без призів; 4–7 — 1 приз; 8 і більше — 2 призи.","Призи видаються за пред’явлення копій паспорта та ІК і оподатковуються податком 19,5%."],

  {

   "title": "Положення про відкритий чемпіонат Одеської області 2021 року з розв’язування шахових композицій",
   "lead": "4 травня 2021 року — три тури: етюди, задачі на мат у три й у два ходи.",
   "body": ["Місце і час проведення чемпіонату: чемпіонат пройде 4 травня (вівторок) у приміщенні Одеського шахово-шашкового клубу за адресою: вулиця Канатна, 95 (ріг вулиці Семінарської). Початок чемпіонату — 11.00. Початок реєстрації — 10.30.","Попередня реєстрація учасників — у директора ОШШК Ігоря Горбунова.","Організатори чемпіонату: Об’єднання шахово-шашкових клубів Одеської області за підтримки «Банку Восток».","Суддівська колегія: головний суддя — Сергій Ткаченко; головний секретар — Ігор Горбунов.","Учасники чемпіонату: до участі в чемпіонаті допускаються шахісти, які сплатили турнірний збір у розмірі 100 гривень.","Правила проведення чемпіонату: змагання пройде у три тури. Перерва між турами — 10 хвилин. У 1-му турі учасникам буде запропоновано розв’язати за 60 хвилин три етюди. У 2-му турі — за 40 хвилин три задачі на мат у три ходи. У 3-му турі — за 20 хвилин три задачі на мат у два ходи.","За правильний і повний розв’язок кожної композиції нараховується 5 балів. Неправильний розв’язок балів не приносить. Переможці визначаються за більшою кількістю набраних балів. За рівності балів вище місце посідає учасник, який витратив на розв’язування менше часу.","Нагородження переможців: учасники, які посіли 1–3-тє місця, нагороджуються медалями, дипломами та книгами з шахів. Переможцю відкритого чемпіонату Одеської області вручається Кубок. Встановлено книжкові призи для найстаршого та наймолодшого учасника."],

  {
   "id": "n-2021-champ-classic",
   "date": "2021-02-26",
   "dateNote": "",
   "year": "2021",
   "title": "Чемпіонат Одеської області з шахів 2021 (класична гра)",
   "lead": "Переміг Олексій Аліфіренко — 7½ очка з 9; друге місце — Олексій Молчанов, третє — Олексій Кукелко.",
   "body": ["Чемпіонат проходив з 26 лютого по 14 березня 2021 року в приміщенні КДЮСШ (вул. Канатна, 95).","## Положення про проведення чемпіонату Одеської області з шахів 2021 року (18.02.2021)","У зв’язку з послабленням карантинних обмежень змінюються формат і строки проведення Чемпіонату Одеської області з шахів 2021 року.","1. Чемпіонат проводиться з метою підвищення спортивної майстерності одеських шахістів і для визначення переможців — учасників чемпіонату України.","2. Чемпіонат проводиться в приміщенні КДЮСШ (Канатна, 95) з 26 лютого по 14 березня за швейцарською системою в 9 турів з обрахунком міжнародного та національного рейтингів. Контроль часу — 90 хвилин на партію кожному учаснику з додаванням 30 секунд після зробленого ходу, починаючи з першого. Турові дні: 26–28.02, 05–07.03, 12–14.03. Початок турів — 16.00. Допустиме запізнення — 60 хвилин. Реєстрація — 26.02 з 14.00 до 15.45. У перших 6 турах допускається двічі взяти нічию без гри, попередивши суддівську колегію до початку жеребкування.","3. До участі допускаються шахісти з 1-м розрядом і вище. Вступний внесок у вигляді добровільних пожертвувань — 300 грн. Знижка для ветеранів (1971 р.н. і старших) та юнаків (2002 р.н. і молодших) — 100 грн. Для учасників без рейтингу ФІДЕ — додатково 150 грн на обрахунок.","4. Переможці визначаються за найбільшою сумою набраних очок. За рівності — черговість додаткових показників: повний коефіцієнт Бухгольца; медіанний коефіцієнт Бухгольца; коефіцієнт прогресу.","5. Призовий фонд — п’ять призів: 4 000, 3 000, 2 000, 2 × 1 000 грн. Призи за категоріями: жінки, ветерани 65+ (1956 р.н. і старші), ветерани 50+ (1971 р.н. і старші), юнаки (2001 р.н. і молодші). За кількості учасників у категорії: 1–3 — без призів; 4–7 — один приз 600 грн; 8 і більше — два призи 600 і 400 грн. Призи видаються за пред’явлення копій паспорта та ІК і оподатковуються податком 19,5%."],

   "title": "Чемпіонат КДЮСШ та Одеської області з шахів до 16, 18 і 20 років (січень — лютий 2021)",
   "lead": "Перше місце в загальній таблиці — Олексій Кукелко (8 очок з 9), друге — Владислав Лимар, третє — Максим Снігуров.",
   "body": ["Чемпіонат проводився з 29 січня по 14 лютого 2021 року.","## Положення про проведення чемпіонату КДЮСШ та Одеської області з шахів 2021 року до 16, 18 і 20 років","1. Мета і завдання: визначення найсильніших шахістів і учасників першості України; підвищення спортивної майстерності та можливість виконання кваліфікаційних норм; пропаганда шахів.","2. Час і місце проведення: чемпіонат проводиться з 29 січня по 14 лютого. За кількості учасників 10–12 — за коловою системою в 9–11 турів; ігрові дні: 29–31.01 (за 11 турів — ще 01.02); 05–07.02 (за 11 турів — ще 08.02); 12–14.02. За кількості учасників 14 і більше — за швейцарською системою в 9 турів; ігрові дні: 29–31.01; 05–07.02; 12–14.02. Реєстрація 29 січня з 15.00 до 15.45. Початок турів — 16.00. У разі посилення карантину на вказаний період чемпіонат може бути відкладено.","3. Контроль часу — 90 хвилин на партію кожному учаснику з додаванням 30 секунд після кожного ходу, починаючи з першого. Допустиме запізнення — 60 хвилин.","4. Учасники: до участі запрошуються КМС з національним коефіцієнтом 2051 і вище 2001 року народження і молодші та 3 переможці Меморіалу І. Постола. За потреби для встановлення норми КМС допускається участь поза конкурсом шахістів старшого віку. Вступний внесок у вигляді добровільних пожертвувань для оплати обрахунку рейтингів — 50 грн (для тих, хто не має міжнародного рейтингу, — 180 грн).","5. Визначення переможців: за рівності набраних очок місця визначаються за такими показниками: для швейцарської системи — Бухгольц, усереднений Бухгольц, прогрес; для колової системи — Бергер, кількість перемог, результати особистих зустрічей. Переможці отримують право участі в чемпіонатах України у відповідних вікових групах."],

  "body": ["Об’єднання шахово-шашкових клубів Одеської області — організація, яка вже багато років тримає на собі шахове й шашкове життя Одеси та області. Ми проводимо обласні чемпіонати з класичних шахів, швидкої гри та бліцу, першості серед юнаків і дівчат, кваліфікаційні та рейтингові турніри, меморіали й святкові змагання.","Наш майданчик — вул. Канатна, 95 в Одесі. Тут щотижня грають, вчаться і виконують розряди сотні людей: від тих, хто вперше сів за дошку, до майстрів спорту й міжнародних майстрів.","Шахи у нас для всіх. Двері відчинені для кожного, хто хоче грати: досвід, рівень і наявність розряду значення не мають.","Кваліфікаційні турніри дають можливість виконати перший юнацький, третій, другий і перший розряди. Рейтингові турніри проводяться з обрахуванням національного та міжнародного рейтингів — тут можна отримати свій перший рейтинг або підвищити наявний. Обласні чемпіонати визначають чемпіона Одещини, а переможець отримує право виступити на чемпіонаті України.","Крім основного заліку, в чемпіонатах відзначають окремі категорії учасників — ветеранів, жінок і гравців з рейтингом ФІДЕ до 2000, тож поборотися за приз має шанс не лише лідер турнірної таблиці.","Змагання проводяться спільно з Федерацією шахів Одеської області та КДЮСШ з шахів і шашок, за підтримки партнерів, серед яких банк «Восток» і АТ «БСТ БАНК». Судять турніри кваліфіковані арбітри, зокрема міжнародний арбітр В. Ф. Богданов. Під час повітряної тривоги учасники переходять до укриття.","Одеса — місто з великою шаховою історією. Тут виріс Володимир Тукмаков — віце-чемпіон світу серед юнаків, «Заслужений тренер ФІДЕ», під керівництвом якого чоловіча збірна України двічі вигравала Всесвітні шахові олімпіади. Ми пишаємося цією традицією і працюємо, щоб вона продовжувалася.","Хочете грати — приходьте. Місце за дошкою знайдеться кожному."]
 },

const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=['січня','лютого','березня','квітня','травня','червня','липня','серпня',
  'вересня','жовтня','листопада','грудня'];
function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso); if(isNaN(d)) return esc(iso);
  return d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();
}
function fmtRange(a,b){
  if(!b||a===b) return fmtDate(a);
  const d1=new Date(a), d2=new Date(b);
  if(d1.getMonth()===d2.getMonth()&&d1.getFullYear()===d2.getFullYear())
    return d1.getDate()+'–'+d2.getDate()+' '+M[d2.getMonth()]+' '+d2.getFullYear();
  return fmtDate(a)+' — '+fmtDate(b);
}

function parseHash(){
  const raw=(location.hash||'#/').replace(/^#\/?/,'');
  const [path,qs]=raw.split('?');
  const seg=path.split('/').filter(Boolean); const q={};
  new URLSearchParams(qs||'').forEach((v,k)=>q[k]=v);
  return {seg,q,route:seg[0]||'home',id:seg[1]||null};
}

  });

/* графік рейтингів з протоколів + поточний FIDE */
function rChart(st){
  if(st.p.fh) return fChart(st);
  const COL={classic:'#1F6F4A',rapid:'#2F6DB5',blitz:'#C2721C'};
  const yf=d=>{const [y,m,dd]=String(d).split('-').map(Number);return y+((m||6)-1)/12+((dd||15)-1)/365;};
  const S={classic:[],rapid:[],blitz:[]};
  st.A.forEach(a=>{ if(a.rat>0&&a.e.date&&S[a.e.disc]) S[a.e.disc].push({t:yf(a.e.date),v:a.rat,a}); });
  const f=st.p.fide, F=f?{classic:f.std,rapid:f.rapid,blitz:f.blitz}:{}, tF=DATA.fideDate?yf(DATA.fideDate+'-15'):0;
  let ts=[],vs=[],n=0;
  for(const d in S){ S[d].sort((x,y)=>x.t-y.t); n+=S[d].length; S[d].forEach(z=>{ts.push(z.t);vs.push(z.v);});
    if(F[d]&&tF&&S[d].length){ts.push(tF);vs.push(F[d]);} }
  if(n<2) return '';
  const aw=$('#app')&&$('#app').clientWidth;
  const W=typeof aw==='number'&&aw>0?Math.max(300,Math.min(1080,aw-62)):760, H=Math.max(210,Math.min(300,Math.round(W*.4)));
  const L=42,R=12,T=12,B=26;
  const x0=Math.floor(Math.min(...ts)), x1=Math.max(...ts)+.25;
  let v0=Math.floor((Math.min(...vs)-30)/100)*100, v1=Math.ceil((Math.max(...vs)+30)/100)*100; if(v1-v0<200) v1=v0+200;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R), Y=v=>T+(v1-v)/(v1-v0)*(H-T-B);
  const step=v1-v0>700?200:100;
  let g='';
  for(let v=v0;v<=v1;v+=step) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#EDEFF2"/>'+
    '<text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';
  for(let y=x0;y<=Math.floor(x1);y++){ g+='<line x1="'+X(y)+'" x2="'+X(y)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#F3F4F6"/>';
    const xm=X(Math.min(y+.5,(y+x1)/2)); if(xm<W-R-8) g+='<text x="'+xm+'" y="'+(H-8)+'" text-anchor="middle">'+y+'</text>'; }
  let lines='', dots='';
  for(const d in S){ const z=S[d]; if(!z.length) continue;
    if(z.length>1) lines+='<path d="'+z.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ')+'" fill="none" stroke="'+COL[d]+'" stroke-width="2.2" stroke-linejoin="round"/>';
    dots+=z.map(p=>'<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.6" fill="'+COL[d]+'" stroke="#fff" stroke-width="1.2">'+
      '<title>'+esc(DISC[d]+' · '+p.v+' · '+p.a.e.label+' · '+dShort(p.a.e.date))+'</title></circle>').join('');
    if(F[d]&&tF){ const l=z[z.length-1];
      lines+='<path d="M'+X(l.t).toFixed(1)+' '+Y(l.v).toFixed(1)+' L'+X(tF).toFixed(1)+' '+Y(F[d]).toFixed(1)+'" fill="none" stroke="'+COL[d]+'" stroke-width="1.6" stroke-dasharray="4 4" opacity=".75"/>';
      dots+='<circle cx="'+X(tF).toFixed(1)+'" cy="'+Y(F[d]).toFixed(1)+'" r="4.4" fill="#fff" stroke="'+COL[d]+'" stroke-width="2.2">'+
        '<title>'+esc(DISC[d]+' · FIDE '+fideWhen()+': '+F[d])+'</title></circle>'; }
  }
  const leg=Object.keys(S).filter(d=>S[d].length).map(d=>'<span><i style="background:'+COL[d]+'"></i>'+DISC[d]+'</span>').join('')+
    (f&&tF?'<span><i class="f"></i>до рейтингу FIDE, '+esc(fideWhen())+'</span>':'');
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Динаміка рейтингу '+esc(st.p.name)+'">'+g+lines+dots+'</svg>'+
    '<div class="legend">'+leg+'</div></div>';
}

/* лічильники: числа «набігають», коли блок з’являється на екрані */
function countUp(){
  const els=$$('[data-n]'); if(!els.length) return;
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const run=el=>{ const n=+el.dataset.n, t0=performance.now(), d=1100;
    const step=t=>{ const k=Math.min(1,(t-t0)/d); el.textContent=Math.round(n*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step); };
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); run(e.target); } }),{threshold:.4});
  els.forEach(el=>{ el.textContent='0'; io.observe(el); });
}

/* запит до publish.php */
async function api(action,fields,files){
  const fd=new FormData(); fd.append('action',action); fd.append('key',ED.key);
  Object.entries(fields||{}).forEach(([k,v])=>fd.append(k,v));
  (files||[]).forEach(([k,b,n])=>fd.append(k,b,n));
  let r; try{ r=await fetch('publish.php',{method:'POST',body:fd,cache:'no-store'}); }
  catch(e){ throw Object.assign(new Error('Немає зв’язку із сервером. Перевірте інтернет.'),{status:0}); }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!j) throw Object.assign(new Error(r.status===404?'На хостингу немає файлу publish.php.':'Сервер відповів помилкою '+r.status+'.'),{status:r.status});
  if(!j.ok) throw Object.assign(new Error(j.error||'Помилка сервера.'),{status:r.status});
  return j;
}
async function freshData(){ const r=await fetch('site-data.json?t='+Date.now(),{cache:'no-store'}); const d=await r.json(); if(!d||!Array.isArray(d.news)) throw new Error('дані недоступні'); return d; }
async function edLogin(pw,silent){
  ED.key=String(pw||''); ED.note='';
  if(/^https?:$/.test(location.protocol)){
    try{
      const j=await api('ping'); ED.srv=true; ED.maxUp=j.maxUpload||0; store('sessionStorage',ED_KEY,ED.key);
      if(j.updated&&j.updated!==DATA.updated&&!ED.dirty){ try{ setData(await freshData()); }catch(e){} }
    }catch(e){
      if([401,403,429].includes(e.status)){ store('sessionStorage',ED_KEY,null); if(!silent) toast(e.message,4500); return; }
      ED.srv=false; ED.note=e.message+' Редагувати можна, але зміни лишаться лише в цьому браузері; '+
        'перенести їх на сайт можна файлом (меню «Ще» → «Зберегти копію даних»).';
    }
  } else { ED.srv=false; ED.note='Сайт відкрито з диска комп’ютера — публікація працює лише на хостингу. '+
    'Зміни можна зберегти файлом site-data.json (меню «Ще»).'; }
  ED.on=true; render();
}

const HEADMAP={'rk.':'Місце','rk':'Місце','pl.':'Місце','місце':'Місце','name':'Учасник','ім’я':'Учасник','прізвище, ім’я':'Учасник','учасник':'Учасник',
  'pts.':'Очки','pts':'Очки','points':'Очки','очки':'Очки','rtg':'Рейтинг','elo':'Рейтинг','rtgi':'Рейтинг','rtgn':'Рейтинг','рейтинг':'Рейтинг',
  'tb1':'Бухг.','bh.':'Бухг.','bh':'Бухг.','buchh.':'Бухг.','sno':'Ст. №','fed':'Федерація','club/city':'Клуб'};
function parseRows(txt){
  const lines=String(txt).replace(/\r/g,'').split('\n').filter(l=>l.trim());
  const tab=lines.some(l=>l.includes('\t')), semi=!tab&&lines.some(l=>l.includes(';')), bar=!tab&&!semi&&lines.some(l=>l.includes('|'));
  return lines.map(l=>(tab?l.split('\t'):semi?l.split(';'):bar?l.split('|'):l.trim().split(/\s{2,}/)).map(c=>c.trim()));
}
function edSet(it,el){
  if(!it) return;
  const path=el.dataset.b.split('.'); let o=it;
  for(let i=0;i<path.length-1;i++){ o=o[path[i]]; if(o==null) return; }
  const k=path[path.length-1];
  let v=el.type==='checkbox'?el.checked:el.value;
  if(k==='body'&&path.length===1) v=el.value.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  if(el.type==='checkbox'&&!v) delete o[k]; else o[k]=v;
  if(path.length===1){
    if(k==='date'&&ED.tab==='news'&&v){ it.year=v.slice(0,4); delete it.sortDate; it.dateNote=''; }
    if(k==='dateStart'&&ED.tab==='res'&&v) it.year=v.slice(0,4);
    if(k==='title'){ const s=$('#edlist a.on span'); if(s) s.textContent=v||'(без назви)'; }
  }
  edMark();
  if(/\.final$/.test(el.dataset.b)||(ED.tab==='res'&&(k==='kind'||k==='newsId'))) edRender();
}
function edTsv(it,el){
  const t=(it.tables||[])[+el.dataset.tsv]; if(!t) return;
  const rows=parseRows(el.value);
  if(!rows.length){ t.head=[]; t.rows=[]; }
  else { const w=Math.max(...rows.map(r=>r.length)), pad=r=>{const x=r.slice();while(x.length<w)x.push('');return x;};
    t.head=pad(rows[0].map(c=>HEADMAP[c.toLowerCase()]||c)); t.rows=rows.slice(1).map(pad);
    const ri=t.head.indexOf('Рейтинг'); if(ri>=0) t.rows.forEach(r=>{ if(/^(0+|-|—)$/.test(r[ri])) r[ri]='б/р'; }); } /* без рейтингу — «б/р» */
  const info=$('[data-tsvinfo="'+el.dataset.tsv+'"]'); if(info) info.textContent=tsvInfo(t);
  edMark();
}
function edPlaces(it,el){

/* фото: зменшення в браузері перед відправкою */
async function prepImage(file,max,q){
  let src;
  try{ src=await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){ src=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i);
    i.onerror=()=>rej(new Error('не вдалося відкрити зображення (формат HEIC? збережіть як JPG)')); i.src=URL.createObjectURL(file); }); }
  const w0=src.width||src.naturalWidth, h0=src.height||src.naturalHeight, k=Math.min(1,max/Math.max(w0,h0));
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w0*k)); c.height=Math.max(1,Math.round(h0*k));
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.imageSmoothingQuality='high'; x.drawImage(src,0,0,c.width,c.height);
  if(src.close) src.close();
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('не вдалося стиснути зображення')),'image/jpeg',q));
}
/* якщо хостинг приймає файли лише до N МБ — дотискаємо зображення, поки не влізе */
async function fitImage(f,max,q){
  let b=await prepImage(f,max,q);
  for(let i=0;i<5&&ED.maxUp&&b.size>ED.maxUp*.9;i++){ max=Math.round(max*.85); q=Math.max(.6,q-.07); b=await prepImage(f,max,q); }
  return b;
}
async function edUpload(kind,input){
  const files=[...input.files]; input.value=''; if(!files.length) return;
  const it=edTarget(); if(!it||!ED.srv) return;
  const prog=$('[data-prog="'+kind+'"]'), say=t=>{ if(prog) prog.textContent=t; ED.busy=t; edStatus(); };
  const base=edSlug(it.title||kind); let done=0; const errs=[];
  for(const f of files){
    say('Завантаження '+(done+errs.length+1)+' з '+files.length+'…');
    try{
      if(kind==='photo'){ const full=await fitImage(f,1600,.85), th=await prepImage(f,480,.8);
        const j=await api('upload',{kind:'photo',name:base},[['file',full,'photo.jpg'],['thumb',th,'thumb.jpg']]);
        (it.photos=it.photos||[]).push({src:j.src,thumb:j.thumb||j.src,caption:''}); }
      else if(kind==='scan'){ const b=await fitImage(f,2400,.9);
        const j=await api('upload',{kind:'scan',name:base},[['file',b,'scan.jpg']]); (it.scans=it.scans||[]).push({src:j.src,caption:''}); }
      else { const img=/^image\//.test(f.type), b=img?await fitImage(f,2400,.9):f;
        if(ED.maxUp&&b.size>ED.maxUp) throw new Error('файл більший за дозволені хостингом '+Math.round(ED.maxUp/1048576)+' МБ');
        const j=await api('upload',{kind:'doc',name:(kind==='reg'?'reglament-':'')+base},[['file',b,img?'doc.jpg':f.name]]);
        if(kind==='reg') it.regulation=j.src; else (it.docs=it.docs||[]).push({title:f.name.replace(/\.[^.]+$/,''),url:j.src}); }
      done++; edMark();
    }catch(e){ errs.push(f.name+': '+e.message); }
  }
  ED.busy=''; edRender();
  toast(errs.length?'Не завантажено — '+errs.join('; '):'Завантажено: '+done+'. Не забудьте «Опублікувати».',errs.length?8000:3000);
}

    /* після появи прибираємо службові класи — наведення знову реагує миттєво */
    setTimeout(()=>el.classList.remove('rv','in'),950+(parseInt(el.style.getPropertyValue('--d'))||0)); }),{rootMargin:'0px 0px -6% 0px',threshold:.06});
  const sel='#app .sec-head, #app .card, #app .tbl-wrap, #app .rc, #app .ach>div, #app .titles a, #app .chart, #app .gal button, #app .scans figure, '+
    '#app .plist>a:nth-child(-n+40), #app .info, #app .article>p, #app .article>h3, #app .tabs, #app .hstats a, #app .ptools, #app .chips, #app .empty, '+
    '#app table.ctbl tbody tr';
  const seen=new Map();
  $$(sel).forEach(el=>{ if(el.closest('.ed')||el.closest('.edbar')) return;
    const k=el.parentElement; const n=seen.get(k)||0; seen.set(k,n+1);
    el.classList.add('rv'); el.style.setProperty('--d',Math.min(n,8)*55+'ms'); RIO.observe(el); });
}
/* лінії графіка рейтингу «малюються» */
function drawCharts(){
  $$('#app .chart svg path').forEach(p=>{ p.setAttribute('pathLength','1'); p.classList.add('drawn'); });
  $$('#app .chart').forEach(c=>c.classList.add('anim'));
}
function motion(r){
  NAVPREV=r;
  COSMOS.forEach(k=>k()); COSMOS.clear();
  if(typeof requestAnimationFrame!=='function'||typeof IntersectionObserver!=='function') return;
  const hero=$('#app .hero'); if(hero){ const cv=hero.querySelector('canvas.cosmos'); if(cv) heroPhotoScene(cv);
    const h1=hero.querySelector('h1.split'); if(h1&&!RM) splitTitle(h1); tilt(hero.querySelector('.hero-ph')); }
  $$('#app .page-head').forEach(ph=>{ if(r.route==='editor') return; let cv=ph.querySelector('canvas.cosmos');
    if(!cv){ cv=document.createElement('canvas'); cv.className='cosmos'; cv.setAttribute('aria-hidden','true'); ph.prepend(cv); ph.classList.add('has-cosmos'); }
    cosmos(cv,true); });
  if(RM) return;
  reveal(); drawCharts(); bindSparks();
  const y=()=>{ if(hero) hero.style.setProperty('--sy',Math.min(scrollY,800)); };
  if(hero&&!RM){ y(); addEventListener('scroll',y,{passive:true}); COSMOS.add(()=>removeEventListener('scroll',y)); }
}
/* іскри з корон чемпіонів під курсором */
function sparks(el){
  const now=performance.now(); if(+el.dataset.sp>now-700) return; el.dataset.sp=now;
  const r=el.getBoundingClientRect(), b=document.createElement('div'); b.className='sparks'; b.setAttribute('aria-hidden','true');
  b.style.left=(r.left+(el.tagName==='B'?9:r.width/2))+'px'; b.style.top=(r.top+r.height/2)+'px';
  for(let i=0;i<12;i++){ const s=document.createElement('i'), a=Math.random()*6.283, d=18+Math.random()*26;
    s.style.setProperty('--dx',(Math.cos(a)*d).toFixed(1)+'px'); s.style.setProperty('--dy',(Math.sin(a)*d-8).toFixed(1)+'px');
    s.style.animationDelay=(Math.random()*80)+'ms'; b.appendChild(s); }
  document.body.appendChild(b); setTimeout(()=>b.remove(),900);
}
function bindSparks(){ $$('#app table.ctbl .cr, #app .yrow b, #app .titles .cr').forEach(el=>el.addEventListener('pointerenter',()=>sparks(el))); }
/* перехід «шахова дошка»: клітинки хвилею накривають екран і відкривають нову сторінку; редактор — без переходів */
let WAVE=null, WBUSY=false, WPEND=false;
function waveGrid(){
  const cell=innerWidth<680?64:96, cols=Math.ceil(innerWidth/cell), rows=Math.ceil(innerHeight/cell);
  if(!WAVE){ WAVE=document.createElement('div'); WAVE.className='wave'; WAVE.setAttribute('aria-hidden','true'); document.body.appendChild(WAVE); }
  if(WAVE.dataset.sz!==cols+'x'+rows){ WAVE.dataset.sz=cols+'x'+rows;
    WAVE.style.gridTemplateColumns='repeat('+cols+',1fr)'; WAVE.style.gridTemplateRows='repeat('+rows+',1fr)';
    let h=''; const span=cols+rows-2||1;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) h+='<i class="'+((r+c)%2?'d':'l')+'" style="--f:'+((r+c)/span).toFixed(3)+'"></i>';
    WAVE.innerHTML=h+'<b>♔</b>'; }
}
let NAVPREV=null; /* останній показаний маршрут (ставить motion) */
function navRender(){
  const cur=parseHash(), prev=NAVPREV||{route:'',id:null,q:{}}, to=cur.route;
  /* хвиля — лише між розділами, сторінками матеріалів і вкладками «Турнірів»; фільтри, сортування, роки — без неї */
  const big=prev.route!==to||(prev.id||'')!==(cur.id||'')||(to==='tournaments'&&(prev.q.tab||'')!==(cur.q.tab||''));
  if(!big||RM||to==='editor'||(typeof ED!=='undefined'&&ED.on)||typeof requestAnimationFrame!=='function'){ render(); return; }
  if(WBUSY){ WPEND=true; return; }
  /* ~3 с (прохання автора): 1 с клітинки накривають, 0,9 с дошка тримається (відблиск, корона), 1 с відкривають.
     Клік по дошці — пропустити. */
  const CELL=260, SPREAD=240, HOLD=500, FAST=300; /* разом ≈1,5 с (прохання автора 15.10.2026) */
  WBUSY=true; waveGrid();
  let rendered=false, timers=[];
  const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
  const done=()=>{ WAVE.className='wave'; WAVE.onclick=null; WBUSY=false; if(WPEND){ WPEND=false; render(); } };
  const open=fast=>{ WAVE.className='wave reveal'+(fast?' fast':''); later(done,fast?FAST:CELL+SPREAD); };
  WAVE.className='wave cover';
  later(()=>{ rendered=true; render(); WAVE.className='wave hold'; later(()=>open(false),HOLD); },CELL+SPREAD);
  WAVE.onclick=()=>{ timers.forEach(clearTimeout); timers=[]; if(!rendered){ rendered=true; render(); } open(true); };
}
/* сузір'я «Кінь» у підвалі: зорі складаються в шахового коня, лінії спалахують по черзі */
const KNIGHT=[[.22,.96],[.82,.96],[.80,.86],[.70,.82],[.74,.62],[.80,.44],[.74,.26],[.62,.14],[.58,.04],[.52,.14],[.40,.18],
  [.24,.34],[.16,.46],[.22,.52],[.36,.50],[.46,.44],[.40,.60],[.32,.80],[.30,.86],[.22,.96]];
function footerSky(){
  const ft=document.querySelector('footer'); if(!ft||ft.querySelector('canvas.sky')) return;
  const cv=document.createElement('canvas'); cv.className='sky'; cv.setAttribute('aria-hidden','true'); ft.prepend(cv); ft.classList.add('has-sky');
  const ctx=cv.getContext&&cv.getContext('2d'); if(!ctx) return;
  let W=0,H=0,raf=0,vis=false,t0=performance.now();
  const st=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.3,p:Math.random()*6.283,s:.6+Math.random()*1.5}));
  const seg=[]; let total=0; for(let i=1;i<KNIGHT.length;i++){ const a=KNIGHT[i-1],b=KNIGHT[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]); seg.push({a,b,l,from:total}); total+=l; }
  const size=()=>{ const r=ft.getBoundingClientRect(), d=Math.min(1.5,devicePixelRatio||1); W=r.width; H=r.height;
    cv.width=Math.round(W*d); cv.height=Math.round(H*d); ctx.setTransform(d,0,0,d,0,0); };
  const draw=(t)=>{
    ctx.clearRect(0,0,W,H);
    for(const s of st){ ctx.globalAlpha=(.25+.45*(.5+.5*Math.sin(t*s.s+s.p))); ctx.fillStyle='#E9DDBE'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,6.283); ctx.fill(); }
    const small=W<680, S=small?Math.min(W*.5,H*.36):Math.min(H*.82,W*.26), ox=W-S-(small?14:W*.05), oy=small?H-S-46:(H-S)/2;
    const P=([x,y])=>[ox+x*S,oy+y*S];
    const cyc=13, k=(t%cyc)/cyc, drawn=RM?1:Math.min(1,k/.35), fade=RM?1:(k>.8?1-(k-.8)/.2*.7:1);
    /* лінії: малюються по черзі, тримаються, згасають до напівпрозорих */
    ctx.lineWidth=1.2; ctx.lineCap='round';
    for(const sg of seg){ const [x1,y1]=P(sg.a),[x2,y2]=P(sg.b);
      ctx.globalAlpha=.16; ctx.strokeStyle='#D9B45C'; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const u=Math.max(0,Math.min(1,(drawn*total-sg.from)/sg.l)); if(u<=0) continue;
      ctx.globalAlpha=.75*fade; ctx.strokeStyle='#E2C06C'; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1+(x2-x1)*u,y1+(y2-y1)*u); ctx.stroke(); }
    /* вогник, що біжить контуром */
    if(!RM&&k>.35&&k<.8){ const d=((k-.35)/.45)*total, sg=seg.find(s=>d>=s.from&&d<=s.from+s.l)||seg[seg.length-1], u=(d-sg.from)/sg.l;
      const [x1,y1]=P(sg.a),[x2,y2]=P(sg.b), x=x1+(x2-x1)*u, y=y1+(y2-y1)*u;
      const g=ctx.createRadialGradient(x,y,0,x,y,14); g.addColorStop(0,'rgba(255,240,200,.95)'); g.addColorStop(1,'rgba(255,240,200,0)');
      ctx.globalAlpha=1; ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,14,0,6.283); ctx.fill(); }
    /* зорі сузір'я */
    KNIGHT.slice(0,-1).forEach((pt,i)=>{ const [x,y]=P(pt), tw=.6+.4*Math.sin(t*1.7+i);
      ctx.globalAlpha=.9*tw; ctx.fillStyle='#FFF4D6'; ctx.beginPath(); ctx.arc(x,y,i===8?2.4:1.7,0,6.283); ctx.fill();
      ctx.globalAlpha=.25*tw; ctx.fillStyle='#E2C06C'; ctx.beginPath(); ctx.arc(x,y,5,0,6.283); ctx.fill(); });
    const [ex,ey]=P([.42,.28]); ctx.globalAlpha=.95; ctx.fillStyle='#FFF4D6'; ctx.beginPath(); ctx.arc(ex,ey,2,0,6.283); ctx.fill(); /* око */
    ctx.globalAlpha=1;
  };
  const loop=now=>{ raf=0; draw((now-t0)/1000); if(vis&&!document.hidden) raf=requestAnimationFrame(loop); };
  const start=()=>{ if(!raf&&vis&&!document.hidden) raf=requestAnimationFrame(loop); };
  size(); draw(0); addEventListener('resize',()=>{ size(); draw((performance.now()-t0)/1000); });
  if(RM||typeof IntersectionObserver!=='function') return;
  new IntersectionObserver(es=>{ vis=es[0].isIntersecting; start(); }).observe(ft);
  document.addEventListener('visibilitychange',start);
}
/* інтро при першому відкритті (раз за візит): золоті частинки збираються в корону й розлітаються зорями */
function introOnce(){
  let seen=null; try{ seen=sessionStorage.getItem('so-intro'); sessionStorage.setItem('so-intro','1'); }catch(e){ seen='1'; }
  if(seen||RM||parseHash().route==='editor'||typeof requestAnimationFrame!=='function') return;
  const ov=document.createElement('div'); ov.id='intro'; ov.setAttribute('aria-hidden','true');
  const cv=document.createElement('canvas'); ov.appendChild(cv); document.body.appendChild(ov); document.body.classList.add('intro-wait');
  const ctx=cv.getContext('2d'); if(!ctx){ ov.remove(); document.body.classList.remove('intro-wait'); return; }
  const d=Math.min(1.5,devicePixelRatio||1), W=innerWidth, H=innerHeight; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
  /* точки корони — з гліфа ♚ на прихованому полотні */
  const oc=document.createElement('canvas'), N=200; oc.width=N; oc.height=N; const o=oc.getContext('2d');
  o.fillStyle='#000'; o.textAlign='center'; o.textBaseline='middle'; o.font='170px Georgia,"Segoe UI Symbol","Noto Sans Symbols2",serif'; o.fillText('♚',N/2,N/2+8);
  const px=o.getImageData(0,0,N,N).data, pts=[];
  for(let y=0;y<N;y+=3) for(let x=0;x<N;x+=3) if(px[(y*N+x)*4+3]>128) pts.push([x-N/2,y-N/2]);
  const cnt=Math.min(pts.length,W<680?320:560), sc=Math.min(W,H)/N*.42, cx=W/2, cy=H/2-H*.06;
  const P=Array.from({length:cnt},()=>{ const t=pts[(Math.random()*pts.length)|0], a=Math.random()*6.283, R=Math.max(W,H)*(.55+Math.random()*.4);
    return {sx:cx+Math.cos(a)*R,sy:cy+Math.sin(a)*R,tx:cx+t[0]*sc,ty:cy+t[1]*sc,dl:Math.random()*.35,r:.8+Math.random()*1.5,vx:0,vy:0,x:0,y:0}; });
  const ease=u=>1-Math.pow(1-u,3); let t0=performance.now(), done=false, burst=false;
  const finish=()=>{ if(done) return; done=true; ov.classList.add('out'); document.body.classList.remove('intro-wait'); setTimeout(()=>ov.remove(),450); };
  const doBurst=()=>{ if(burst) return; burst=true; P.forEach(p=>{ const dx=p.x-cx, dy=p.y-cy, l=Math.hypot(dx,dy)||1, v=380+Math.random()*520; p.vx=dx/l*v; p.vy=dy/l*v; }); };
  ov.addEventListener('click',()=>{ doBurst(); setTimeout(finish,250); });
  addEventListener('keydown',function k(){ removeEventListener('keydown',k); doBurst(); setTimeout(finish,250); });
  let last=t0;
  const frame=now=>{ const t=(now-t0)/1000, dt=Math.min(.05,(now-last)/1000); last=now;
    ctx.clearRect(0,0,W,H); ctx.fillStyle='#0F2E22'; ctx.fillRect(0,0,W,H);
    if(t>1.25) doBurst();
    for(const p of P){
      if(!burst){ const u=ease(Math.max(0,Math.min(1,(t-p.dl)/.85))); p.x=p.sx+(p.tx-p.sx)*u; p.y=p.sy+(p.ty-p.sy)*u; }
      else { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.985; p.vy*=.985; }
      const a=burst?Math.max(0,1-(t-1.25)/.55):Math.min(1,t*2);
      ctx.globalAlpha=a*.3; ctx.fillStyle='#D9B45C'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.8,0,6.283); ctx.fill();
      ctx.globalAlpha=a; ctx.fillStyle='#FFF1CF'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill(); }
    /* назва під короною */
    const wa=t<.6?0:burst?Math.max(0,1-(t-1.25)/.3):Math.min(1,(t-.6)/.4);
    if(wa>0){ ctx.globalAlpha=wa; ctx.fillStyle='#F4EEE2'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='700 '+Math.round(Math.min(W*.075,46))+'px "Playfair Display",Georgia,serif'; ctx.fillText('Шахова Одеса',cx,cy+N/2*sc+Math.min(H*.07,48)); }
    ctx.globalAlpha=1;
    if(t>1.45) finish();
    if(t<2.2) requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
  setTimeout(finish,3200); /* запобіжник */
}

$('#drawer').innerHTML=[['#/','Головна'],['#/news','Новини'],['#/tournaments','Турніри'],['#/players','Шахісти'],
  ['#/about','Про нас'],['#/contacts','Контакти']]
  .map(i=>'<a href="'+i[0]+'">'+i[1]+'</a>').join('');

document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#drawer').classList.remove('open');});
$('#fYear').textContent='© '+new Date().getFullYear()+' Шахова Одеса';

</script>
